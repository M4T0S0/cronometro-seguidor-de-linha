# Roda a cada envio para o GitHub: testes da página, página compactada em
# dia e compilação do firmware com as mesmas versões que eu uso no
# Arduino IDE. Se algo quebrar, aparece um X vermelho no commit.
name: Verificar

on:
  push:
  pull_request:

env:
  ESP32_URL: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Testes da página do juiz
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

      - name: Página compactada em dia com o index.html
        run: python3 ferramentas/gerar_pagina.py --check

      - name: Cache da placa e das bibliotecas
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-2.0.14-ssd1306-2.5.17-gfx-1.12.6-busio-1.17.4-json-7.4.3

      - uses: arduino/setup-arduino-cli@v2

      - name: Placa esp32 2.0.14 e bibliotecas (versões fixas, iguais às do README)
        run: |
          pip install pyserial
          arduino-cli core update-index --additional-urls "$ESP32_URL"
          arduino-cli core install esp32:esp32@2.0.14 --additional-urls "$ESP32_URL"
          arduino-cli lib install "Adafruit SSD1306@2.5.17" "Adafruit GFX Library@1.12.6" "Adafruit BusIO@1.17.4" "ArduinoJson@7.4.3"

      - name: Compilar o firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/cronometro 2>&1 | tee compilacao.txt

      - name: Memória do programa abaixo de 95%
        run: |
          uso=$(grep -o 'Sketch uses [0-9]* bytes ([0-9]*%)' compilacao.txt | grep -o '[0-9]*%' | tr -d '%')
          echo "Memória do programa: ${uso}%"
          if [ -z "$uso" ] || [ "$uso" -ge 95 ]; then
            echo "::error::A memória do programa está em ${uso}% - pouco espaço para funções novas."
            exit 1
          fi
