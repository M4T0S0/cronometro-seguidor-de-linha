<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 980" width="1100" height="980" font-family="Arial, Helvetica, sans-serif">
  <rect width="1100" height="980" fill="#ffffff"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#111">Ligações do cronômetro (ESP32 DevKit)</text>

  <!-- Barramentos -->
  <line x1="60" y1="80" x2="60" y2="850" stroke="#222" stroke-width="3"/>
  <line x1="95" y1="80" x2="95" y2="850" stroke="#dc2626" stroke-width="3"/>
  <text x="60" y="72" font-size="13" font-weight="700" text-anchor="middle" fill="#222">GND</text>
  <text x="95" y="72" font-size="13" font-weight="700" text-anchor="middle" fill="#dc2626">5 V</text>

  <!-- ESP32 -->
  <rect x="640" y="80" width="170" height="760" rx="12" fill="#1f2937"/>
  <text x="725" y="430" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">ESP32</text>
  <text x="725" y="456" font-size="14" fill="#cbd5e1" text-anchor="middle">DevKit</text>
  <g font-size="13" fill="#fff">
    <text x="652" y="134">GPIO 32</text>
    <text x="652" y="214">GPIO 33</text>
    <text x="652" y="324">GPIO 25</text>
    <text x="652" y="484">GPIO 26</text>
    <text x="652" y="624">GPIO 27</text>
    <text x="652" y="679">GPIO 14</text>
    <text x="652" y="729">GND</text>
    <text x="652" y="774">GPIO 13</text>
    <text x="652" y="819">VIN</text>
    <text x="798" y="164" text-anchor="end">GPIO 22</text>
    <text x="798" y="204" text-anchor="end">GPIO 21</text>
    <text x="798" y="244" text-anchor="end">GND</text>
    <text x="798" y="284" text-anchor="end">3V3</text>
  </g>

  <!-- Chave do modo treino: GPIO 32 - chave - GND -->
  <line x1="640" y1="130" x2="470" y2="130" stroke="#111" stroke-width="2.5"/>
  <circle cx="470" cy="130" r="5" fill="#fff" stroke="#111" stroke-width="2"/>
  <circle cx="410" cy="130" r="5" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="413" y1="127" x2="462" y2="108" stroke="#111" stroke-width="2.5"/>
  <line x1="405" y1="130" x2="60" y2="130" stroke="#111" stroke-width="2.5"/>
  <circle cx="60" cy="130" r="5" fill="#222"/>
  <text x="440" y="96" font-size="14" font-weight="700" text-anchor="middle" fill="#111">Chave do modo treino</text>
  <text x="440" y="154" font-size="12" text-anchor="middle" fill="#555">fechada = treino</text>

  <!-- Botão de reset: GPIO 33 - botão - GND -->
  <line x1="640" y1="210" x2="470" y2="210" stroke="#111" stroke-width="2.5"/>
  <circle cx="470" cy="210" r="5" fill="#fff" stroke="#111" stroke-width="2"/>
  <circle cx="410" cy="210" r="5" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="402" y1="196" x2="478" y2="196" stroke="#111" stroke-width="2.5"/>
  <line x1="440" y1="196" x2="440" y2="182" stroke="#111" stroke-width="2.5"/>
  <line x1="424" y1="182" x2="456" y2="182" stroke="#111" stroke-width="2.5"/>
  <line x1="405" y1="210" x2="60" y2="210" stroke="#111" stroke-width="2.5"/>
  <circle cx="60" cy="210" r="5" fill="#222"/>
  <text x="440" y="236" font-size="14" font-weight="700" text-anchor="middle" fill="#111">Botão de reset</text>
  <text x="440" y="253" font-size="12" text-anchor="middle" fill="#555">segurar 3 s ao ligar</text>

  <!-- Sensor de largada (GPIO 25) -->
  <g>
    <rect x="150" y="280" width="140" height="80" rx="8" fill="#f3f4f6" stroke="#555" stroke-width="2"/>
    <text x="220" y="314" font-size="14" font-weight="700" text-anchor="middle" fill="#111">E18-D80NK</text>
    <text x="220" y="334" font-size="13" text-anchor="middle" fill="#111">Sensor de largada</text>
    <line x1="150" y1="298" x2="95" y2="298" stroke="#8b4513" stroke-width="2.5"/>
    <circle cx="95" cy="298" r="5" fill="#dc2626"/>
    <text x="124" y="292" font-size="10" text-anchor="middle" fill="#8b4513">marrom</text>
    <line x1="150" y1="342" x2="60" y2="342" stroke="#1d4ed8" stroke-width="2.5"/>
    <circle cx="60" cy="342" r="5" fill="#222"/>
    <text x="124" y="358" font-size="10" text-anchor="middle" fill="#1d4ed8">azul</text>
    <line x1="290" y1="320" x2="330" y2="320" stroke="#111" stroke-width="2.5"/>
    <text x="310" y="338" font-size="10" text-anchor="middle" fill="#111">preto</text>
    <rect x="330" y="312" width="70" height="16" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="365" y="305" font-size="12" text-anchor="middle" fill="#111">100 kΩ</text>
    <line x1="400" y1="320" x2="640" y2="320" stroke="#111" stroke-width="2.5"/>
    <circle cx="500" cy="320" r="5" fill="#111"/>
    <line x1="500" y1="320" x2="500" y2="342" stroke="#111" stroke-width="2.5"/>
    <rect x="492" y="342" width="16" height="60" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="516" y="377" font-size="12" fill="#111">220 kΩ</text>
    <line x1="500" y1="402" x2="500" y2="415" stroke="#111" stroke-width="2.5"/>
    <line x1="500" y1="415" x2="60" y2="415" stroke="#111" stroke-width="2.5"/>
    <circle cx="60" cy="415" r="5" fill="#222"/>
  </g>

  <!-- Sensor de chegada (GPIO 26) -->
  <g>
    <rect x="150" y="440" width="140" height="80" rx="8" fill="#f3f4f6" stroke="#555" stroke-width="2"/>
    <text x="220" y="474" font-size="14" font-weight="700" text-anchor="middle" fill="#111">E18-D80NK</text>
    <text x="220" y="494" font-size="13" text-anchor="middle" fill="#111">Sensor de chegada</text>
    <line x1="150" y1="458" x2="95" y2="458" stroke="#8b4513" stroke-width="2.5"/>
    <circle cx="95" cy="458" r="5" fill="#dc2626"/>
    <text x="124" y="452" font-size="10" text-anchor="middle" fill="#8b4513">marrom</text>
    <line x1="150" y1="502" x2="60" y2="502" stroke="#1d4ed8" stroke-width="2.5"/>
    <circle cx="60" cy="502" r="5" fill="#222"/>
    <text x="124" y="518" font-size="10" text-anchor="middle" fill="#1d4ed8">azul</text>
    <line x1="290" y1="480" x2="330" y2="480" stroke="#111" stroke-width="2.5"/>
    <text x="310" y="498" font-size="10" text-anchor="middle" fill="#111">preto</text>
    <rect x="330" y="472" width="70" height="16" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="365" y="465" font-size="12" text-anchor="middle" fill="#111">100 kΩ</text>
    <line x1="400" y1="480" x2="640" y2="480" stroke="#111" stroke-width="2.5"/>
    <circle cx="500" cy="480" r="5" fill="#111"/>
    <line x1="500" y1="480" x2="500" y2="502" stroke="#111" stroke-width="2.5"/>
    <rect x="492" y="502" width="16" height="60" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="516" y="537" font-size="12" fill="#111">220 kΩ</text>
    <line x1="500" y1="562" x2="500" y2="575" stroke="#111" stroke-width="2.5"/>
    <line x1="500" y1="575" x2="60" y2="575" stroke="#111" stroke-width="2.5"/>
    <circle cx="60" cy="575" r="5" fill="#222"/>
  </g>

  <!-- LED verde (GPIO 27) -->
  <line x1="640" y1="620" x2="560" y2="620" stroke="#111" stroke-width="2.5"/>
  <rect x="490" y="613" width="70" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="525" y="606" font-size="11" text-anchor="middle" fill="#111">220 Ω</text>
  <line x1="490" y1="620" x2="440" y2="620" stroke="#111" stroke-width="2.5"/>
  <polygon points="440,607 440,633 416,620" fill="#16a34a" stroke="#111" stroke-width="1.5"/>
  <line x1="414" y1="607" x2="414" y2="633" stroke="#111" stroke-width="2.5"/>
  <line x1="414" y1="620" x2="60" y2="620" stroke="#111" stroke-width="2.5"/>
  <circle cx="60" cy="620" r="5" fill="#222"/>
  <text x="300" y="612" font-size="14" font-weight="700" text-anchor="middle" fill="#15803d">LED verde</text>

  <!-- LED vermelho (GPIO 14) -->
  <line x1="640" y1="675" x2="560" y2="675" stroke="#111" stroke-width="2.5"/>
  <rect x="490" y="668" width="70" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="525" y="661" font-size="11" text-anchor="middle" fill="#111">220 Ω</text>
  <line x1="490" y1="675" x2="440" y2="675" stroke="#111" stroke-width="2.5"/>
  <polygon points="440,662 440,688 416,675" fill="#dc2626" stroke="#111" stroke-width="1.5"/>
  <line x1="414" y1="662" x2="414" y2="688" stroke="#111" stroke-width="2.5"/>
  <line x1="414" y1="675" x2="60" y2="675" stroke="#111" stroke-width="2.5"/>
  <circle cx="60" cy="675" r="5" fill="#222"/>
  <text x="300" y="667" font-size="14" font-weight="700" text-anchor="middle" fill="#b91c1c">LED vermelho</text>

  <!-- GND da placa -->
  <line x1="640" y1="725" x2="60" y2="725" stroke="#222" stroke-width="3"/>
  <circle cx="60" cy="725" r="5" fill="#222"/>
  <text x="350" y="717" font-size="13" text-anchor="middle" fill="#222">GND da placa</text>

  <!-- Buzzer (GPIO 13) -->
  <line x1="640" y1="770" x2="467" y2="770" stroke="#111" stroke-width="2.5"/>
  <circle cx="445" cy="770" r="22" fill="#fde68a" stroke="#111" stroke-width="2"/>
  <text x="445" y="775" font-size="13" font-weight="700" text-anchor="middle" fill="#111">BZ</text>
  <text x="474" y="760" font-size="14" font-weight="700" fill="#111">+</text>
  <line x1="423" y1="770" x2="60" y2="770" stroke="#111" stroke-width="2.5"/>
  <circle cx="60" cy="770" r="5" fill="#222"/>
  <text x="300" y="762" font-size="14" font-weight="700" text-anchor="middle" fill="#111">Buzzer</text>

  <!-- Alimentação: VIN -> 5 V -->
  <line x1="640" y1="815" x2="95" y2="815" stroke="#dc2626" stroke-width="3"/>
  <circle cx="95" cy="815" r="5" fill="#dc2626"/>
  <text x="350" y="807" font-size="13" text-anchor="middle" fill="#dc2626">VIN (5 V do USB) alimenta os sensores</text>

  <!-- Display OLED -->
  <rect x="900" y="130" width="160" height="180" rx="8" fill="#f3f4f6" stroke="#555" stroke-width="2"/>
  <text x="980" y="152" font-size="14" font-weight="700" text-anchor="middle" fill="#111">Display OLED</text>
  <text x="980" y="170" font-size="11" text-anchor="middle" fill="#333">SSD1306 128x64 I2C</text>
  <rect x="918" y="212" width="130" height="84" rx="4" fill="#0b1220"/>
  <text x="983" y="259" font-size="12" text-anchor="middle" fill="#7dd3fc">00:11.501</text>
  <line x1="810" y1="160" x2="900" y2="160" stroke="#ca8a04" stroke-width="2.5"/>
  <text x="855" y="154" font-size="11" text-anchor="middle" fill="#ca8a04">SCL</text>
  <line x1="810" y1="200" x2="900" y2="200" stroke="#2563eb" stroke-width="2.5"/>
  <text x="855" y="194" font-size="11" text-anchor="middle" fill="#2563eb">SDA</text>
  <line x1="810" y1="240" x2="900" y2="240" stroke="#222" stroke-width="2.5"/>
  <text x="855" y="234" font-size="11" text-anchor="middle" fill="#222">GND</text>
  <line x1="810" y1="280" x2="900" y2="280" stroke="#dc2626" stroke-width="2.5"/>
  <text x="855" y="274" font-size="11" text-anchor="middle" fill="#dc2626">VCC</text>

  <!-- Observações -->
  <g font-size="13" fill="#333">
    <text x="40" y="880">Os pinos do ESP32 aparecem na ordem em que estão na placa, sem os que não são usados. Todos ficam em firmware/cronometro/config.h.</text>
    <text x="40" y="904">Divisor em cada sensor: o E18-D80NK manda 5 V e o ESP32 aceita 3,3 V. 100 kΩ entre o fio preto e o pino, 220 kΩ entre o pino e o GND (cerca de 3,4 V no pino).</text>
    <text x="40" y="928">Fios do E18-D80NK: marrom no 5 V, azul no GND, preto é o sinal. Pontos cheios são ligações; fios que só se cruzam não estão ligados.</text>
    <text x="40" y="952">Resistor dos LEDs: 220 Ω é um valor de exemplo; qualquer valor entre 220 e 470 Ω funciona.</text>
  </g>
</svg>
