}

// Agrupa robôs por equipe (equipes em ordem alfabética, robôs também).
function groupByTeam(teams, parts) {
  const sorted = [...teams].sort((a, b) => a.name.localeCompare(b.name));
  const byTeam = new Map(sorted.map(t => [t.id, []]));
  parts.forEach(p => { if (byTeam.has(p.team_id)) byTeam.get(p.team_id).push(p); });
  byTeam.forEach(list => list.sort((a, b) => a.name.localeCompare(b.name)));
  return sorted.map(t => ({ team: t, robots: byTeam.get(t.id) }));
}

// Busca: casa só pelo COMEÇO do nome (a primeira palavra), sem
// acento nem maiúscula - "d" acha "Dragão", mas não "Seguidor de Linha";
// "ve" acha "Ventania", mas não "Overlord". Retorna 0 se casa, -1 se não.
function wordPrefixIndex(name, query) {
  const q = normalizeKey(query);
  if (!q) return -1;
  return normalizeKey(name).startsWith(q) ? 0 : -1;
}

// Nome com o trecho buscado destacado (já escapado).
function highlightMatch(name, query) {
  const i = wordPrefixIndex(name, query);
  if (i < 0) return escapeHtml(name);
  const len = normalizeKey(query).length;
  return escapeHtml(name.slice(0, i)) + '<mark class="hit">' + escapeHtml(name.slice(i, i + len)) + '</mark>' + escapeHtml(name.slice(i + len));
}

// Resultados da busca como lista simples: robôs (com a equipe ao lado) e
// equipes, cada um em ordem alfabética. A busca NUNCA abre/fecha as
// equipes da lista normal - apagar a busca volta tudo como estava.
function searchRoster(groups, query) {
  const robots = [];
  groups.forEach(g => g.robots.forEach(p => { if (wordPrefixIndex(p.name, query) >= 0) robots.push({ p, team: g.team }); }));
  robots.sort((a, b) => a.p.name.localeCompare(b.p.name));
  const teams = groups.filter(g => wordPrefixIndex(g.team.name, query) >= 0);
  return { robots, teams };
}

async function renderRosterPage(root) {
  let teams, parts;
  try {
    [teams, parts] = await Promise.all([api('GET', '/teams'), api('GET', '/participants')]);
  } catch (e) {
    root.innerHTML = '<a class="back" href="#/">&larr; Início</a><p>' + escapeHtml(e.message) + '</p>';
    return;
  }
  const ui = rosterUi;
  const groups = groupByTeam(teams, parts);
  const msg = ui.msg ? `<div class="import-msg ${ui.msg.warn ? 'warn' : ''}">${escapeHtml(ui.msg.text)}</div>` : '';
  ui.msg = null;

  root.innerHTML = `
    <a class="back" href="#/">&larr; Início</a>
    <h1>Equipes e robôs</h1>
    <p class="muted page-sub">Cadastro geral, vale para todas as competições. Para inscrever robôs numa prova, abra a competição.</p>
    ${msg}
    <div class="btn-row" style="margin-bottom:12px;">
      <button class="btn-primary" id="new-team-btn">+ Nova equipe</button>
      <button class="btn-ghost" id="import-btn">Importar arquivo</button>
    </div>
    <input id="roster-search" type="search" placeholder="Buscar robô ou equipe" aria-label="Buscar robô ou equipe" value="${escapeHtml(ui.search)}">
    <p class="muted list-meta">${plural(teams.length, 'equipe', 'equipes')} · ${plural(parts.length, 'robô', 'robôs')}${teams.length ? ' · toque numa equipe para ver os robôs' : ''}</p>
    <div id="roster-list"></div>
  `;

  const rerender = () => renderRosterPage(root);
  const listBox = document.getElementById('roster-list');
  const teamOptions = (selectedId) => groups.map(g =>
    `<option value="${g.team.id}" ${g.team.id === selectedId ? 'selected' : ''}>${escapeHtml(g.team.name)}</option>`).join('');

  function robotRow(p, nameHtml, meta) {
    return `
        <div class="robot-row">
          <span class="avatar">${initials(p.name)}</span><span class="rn">${nameHtml}</span>
          <span class="p-meta">${meta}</span>
          <span style="white-space:nowrap;">
            <button class="link-btn link-primary" data-act="edit" data-part="${p.id}">editar</button>
            <button class="link-btn" data-act="delete" data-part="${p.id}">excluir</button>
          </span>
        </div>`;
  }

  function drawSearchResults() {
    const res = searchRoster(groups, ui.search);
    if (!res.robots.length && !res.teams.length) {
      listBox.innerHTML = `<p class="muted">Nenhum robô ou equipe começa com "${escapeHtml(ui.search.trim())}".</p>`;
      return;
    }
    let html = '';
    if (res.robots.length) {
      html += `<h2 class="results-h">Robôs</h2><div class="team-card"><div class="team-body" style="border-top:none;">` +
        res.robots.map(x => robotRow(x.p, highlightMatch(x.p.name, ui.search), escapeHtml(x.team.name))).join('') + '</div></div>';
    }
    if (res.teams.length) {
      // A equipe abre ali mesmo, sem sair da busca.
      html += `<h2 class="results-h">Equipes</h2>` + res.teams.map(g => {
        const isOpen = !!ui.searchOpen[g.team.id];
        const body = isOpen ? `<div class="team-body">${g.robots.map(p => robotRow(p, escapeHtml(p.name), escapeHtml(p.external_code || ''))).join('')}` +
          (g.robots.length ? '' : '<p class="muted hint">Nenhum robô nesta equipe.</p>') + '</div>' : '';
        return `<div class="team-card"><div class="team-head">
            <button class="team-toggle" data-act="search-toggle" data-team="${g.team.id}" aria-expanded="${isOpen}">
              ${chevronSvg(isOpen)}<span class="tn">${highlightMatch(g.team.name, ui.search)}</span><span class="tc">${plural(g.robots.length, 'robô', 'robôs')}</span>
            </button></div>${body}</div>`;
      }).join('');
    }
    listBox.innerHTML = html;
  }

  function drawList() {
    if (groups.length === 0) {
      listBox.innerHTML = '<div class="panel"><p class="muted" style="margin:0;">Nenhuma equipe cadastrada ainda. Crie uma equipe ou importe uma planilha.</p></div>';
      return;
    }
    if (ui.search.trim() !== '') { drawSearchResults(); return; }
    listBox.innerHTML = groups.map(g => {
      const t = g.team;
      const isOpen = !!ui.open[t.id];
      const head = `
        <div class="team-head">
          <button class="team-toggle" data-act="toggle" data-team="${t.id}" aria-expanded="${isOpen}">
            ${chevronSvg(isOpen)}<span class="tn">${escapeHtml(t.name)}</span><span class="tc">${plural(g.robots.length, 'robô', 'robôs')}</span>
          </button>
          <button class="link-btn link-primary" data-act="rename" data-team="${t.id}">renomear</button>
        </div>`;
      if (!isOpen) return `<div class="team-card">${head}</div>`;
      const rows = g.robots.map(p => robotRow(p, escapeHtml(p.name), escapeHtml(p.external_code || ''))).join('');
      const empty = g.robots.length === 0
        ? `<p class="muted hint">Nenhum robô nesta equipe. <button class="link-btn" data-act="delete-team" data-team="${t.id}">excluir equipe</button></p>` : '';
      return `<div class="team-card">${head}<div class="team-body">${rows}${empty}` +
        `<button class="add-row" data-act="add" data-team="${t.id}">+ robô nesta equipe</button></div></div>`;
    }).join('');
  }
  drawList();

  // ---------------- Painéis: todo formulário desta tela ----------------

  // Formulário padrão do painel: campos + [Cancelar][ação]. onSubmit(fd)
  // devolve false para manter o painel aberto (ex.: erro de validação).
  function formSheet(title, fieldsHtml, submitLabel, onSubmit, opts = {}) {
    openSheet(title, `
      <form id="sheet-form">
        ${fieldsHtml}
        <div class="btn-row">
          <button class="btn-ghost" type="button" data-sheet-close>${opts.cancelLabel || 'Cancelar'}</button>
          <button class="${opts.danger ? 'btn-danger' : 'btn-primary'}" type="submit">${submitLabel}</button>
        </div>
      </form>`, (body) => {
      body.querySelector('#sheet-form').addEventListener('submit', (e) => {
        e.preventDefault();
        onSubmit(new FormData(e.target), e.target);
      });
      if (opts.onMount) opts.onMount(body);
    });
  }

  function openNewTeamSheet() {
    formSheet('Nova equipe', `<label>Nome da equipe<input name="name" required placeholder="Ex.: Equipe Falcão" autocomplete="off"></label>`,
      'Criar equipe', (fd) => {
        const name = (fd.get('name') || '').trim();
        const err = validateEditName(name, 'da equipe');
        if (err) { showError(err); return; }
        withBusy(async () => {
          const team = await api('POST', '/teams', { name });
          ui.open[team.id] = true;
          await rerender();
          // Equipe nova quase sempre vem com robôs: já abre o cadastro deles.
          openAddRobotSheet(team, `Equipe "${team.name}" criada. Cadastre os robôs dela:`);
        });
      });
  }

  function openRenameTeamSheet(team) {
    formSheet('Renomear equipe', `<label>Nome da equipe<input name="name" required value="${escapeHtml(team.name)}" autocomplete="off"></label>`,
      'Salvar', (fd) => {
        const name = (fd.get('name') || '').trim();
        const err = validateEditName(name, 'da equipe');
        if (err) { showError(err); return; }
        withBusy(async () => {
          await api('PATCH', '/teams/' + team.id, { name });
          closeSheet();
          ui.msg = { text: 'Equipe renomeada.' };
          rerender();
        });
      });
  }

  // Fica aberto depois de cadastrar, com o campo limpo, para cadastrar
  // vários robôs seguidos; "Concluir" fecha.
  function openAddRobotSheet(team, intro) {
    formSheet('Novo robô em ' + team.name, `
      <p class="muted hint" id="add-robot-msg" style="margin-top:0;">${escapeHtml(intro || '')}</p>
      <label>Nome do robô<input name="name" required placeholder="Nome do robô" autocomplete="off"></label>
      <label>Código (opcional)<input name="external_code" autocomplete="off"></label>`,
      'Cadastrar', (fd, form) => {
        const name = (fd.get('name') || '').trim();
        const code = (fd.get('external_code') || '').trim();
        const err = validateEditName(name, 'do robô') || validateCode(code);
        if (err) { showError(err); return; }
        withBusy(async () => {
          await api('POST', '/participants', { name, team_id: team.id, external_code: code });
          ui.open[team.id] = true;
          rerender();
          form.reset();
          const m = document.getElementById('add-robot-msg');
          if (m) { m.textContent = `Robô "${name}" cadastrado. Cadastre outro ou toque em Concluir.`; m.style.color = 'var(--success)'; }
          form.querySelector('input[name=name]').focus();
        });
      }, { cancelLabel: 'Concluir' });
  }

  function openEditRobotSheet(p) {
    formSheet('Editar robô', `
      <label>Nome do robô<input name="name" required value="${escapeHtml(p.name)}" autocomplete="off"></label>
      <label>Equipe<select name="team_id">${teamOptions(p.team_id)}</select></label>
      <label>Código (opcional)<input name="external_code" value="${escapeHtml(p.external_code || '')}" autocomplete="off"></label>
      <p class="muted hint" style="margin-top:-4px;">As corridas já feitas por este robô continuam com ele e passam a mostrar os dados corrigidos.</p>`,
      'Salvar', (fd) => {
        const name = (fd.get('name') || '').trim();
        const code = (fd.get('external_code') || '').trim();
        const err = validateEditName(name, 'do robô') || validateCode(code);
        if (err) { showError(err); return; }
        const teamId = parseInt(fd.get('team_id'), 10);
        withBusy(async () => {
          const res = await api('PATCH', '/participants/' + p.id, { name, team_id: teamId, external_code: code });
          closeSheet();
          // Renomear também corrige as corridas já enviadas pra nuvem.
          if (res.cloud_rename === 'synced') ui.msg = { text: 'Robô atualizado. A nuvem também foi atualizada.' };
          else if (res.cloud_rename === 'pending') ui.msg = { text: 'Robô atualizado. A nuvem será atualizada assim que o cronômetro estiver conectado à internet.', warn: true };
          else ui.msg = { text: 'Robô atualizado.' };
          // Na lista normal, mostra o robô onde ele foi parar (durante a
          // busca não mexe nas equipes abertas).
          if (ui.search.trim() === '') ui.open[teamId] = true;
          rerender();
        });
      });
  }

  // Exclusão: mostra o que some junto e, se o robô já correu,
  // pede o nome digitado - não tem como desfazer.
  function openDeleteRobotSheet(p, info) {
    const hasRuns = info.runs > 0;
    formSheet(`Excluir "${p.name}"?`, hasRuns ? `
      <p class="hint" style="margin-top:0;">Este robô tem <strong>${plural(info.runs, 'corrida', 'corridas')}</strong>
        em ${plural(info.competitions, 'competição', 'competições')}. Tudo isso será apagado do ranking, do histórico e da
        exportação, e ele sai de todas as competições. <strong>Não tem como desfazer.</strong></p>
      <p class="hint muted">Se o ranking online estiver ligado, elas saem de lá também.
        Quer um backup antes? <button class="link-btn link-primary" type="button" id="sheet-export" style="padding:0;">Baixar dados</button></p>
      <label>Digite <strong>${escapeHtml(p.name)}</strong> para confirmar<input name="confirm_name" autocomplete="off" required></label>`
      : `<p class="hint muted" style="margin-top:0;">Ele não tem nenhuma corrida registrada. Sai do cadastro e de todas as competições.</p>`,
      'Excluir definitivamente', (fd) => {
        if (hasRuns && normalizeKey(fd.get('confirm_name') || '') !== normalizeKey(p.name)) {
          showError('Digite o nome do robô exatamente como aparece para confirmar.');
          return;
        }
        withBusy(async () => {
          const res = await api('DELETE', '/participants/' + p.id);
          closeSheet();
          let text = `Robô "${p.name}" excluído` + (res.runs_deleted ? ` junto com ${plural(res.runs_deleted, 'corrida', 'corridas')}.` : '.');
          // As corridas também saem da nuvem.
          if (res.runs_deleted && res.cloud_delete === 'synced') text += ' A nuvem também foi atualizada.';
          else if (res.runs_deleted && res.cloud_delete === 'pending') text += ' A nuvem será atualizada assim que o cronômetro estiver conectado à internet.';
          ui.msg = { text, warn: res.cloud_delete === 'pending' && res.runs_deleted > 0 };
          rerender();
        });
      }, {
        danger: true,
        onMount: (body) => {
          const exp = body.querySelector('#sheet-export');
          if (exp) exp.addEventListener('click', () => withBusy(downloadExport));
        },
      });
  }

  function openDeleteTeamSheet(team) {
    formSheet(`Excluir "${team.name}"?`, `<p class="hint muted" style="margin-top:0;">A equipe não tem nenhum robô.</p>`,
      'Excluir equipe', () => {
        withBusy(async () => {
          await api('DELETE', '/teams/' + team.id);
          closeSheet();
          ui.msg = { text: `Equipe "${team.name}" excluída.` };
          rerender();
        });
      }, { danger: true });
  }

  // Importar: escolher arquivo -> prévia -> cadastrar, tudo no mesmo painel.
  function openImportSheet(rows) {
    if (!rows) {
      openSheet('Importar arquivo', `
        <p class="muted" style="font-size:.85rem; margin-top:0;">Planilha com as colunas <strong>equipe</strong>, <strong>robo</strong>
          e, se quiser, <strong>codigo</strong>. No Excel, use "Salvar como" &rarr; CSV. Comece pelo modelo.</p>
        <label>Arquivo<input type="file" id="import-file" accept=".csv,.json,.txt,text/csv,application/json"></label>
        <button class="btn-ghost" type="button" id="import-template-btn">Baixar modelo</button>`, (body) => {
        body.querySelector('#import-template-btn').addEventListener('click', downloadImportTemplate);
        const fileInput = body.querySelector('#import-file');
        fileInput.addEventListener('change', async () => {
          const file = fileInput.files[0];
          if (!file) return;
          try {
            openImportSheet(await readImportFile(file));
          } catch (e) {
            showError('Não foi possível ler o arquivo: ' + e.message);
            fileInput.value = '';
          }
        });
      });
      return;
    }
    const ok = rows.filter(r => !r.error);
    const bad = rows.length - ok.length;
    const nTeams = new Set(ok.map(r => normalizeKey(r.team))).size;
    openSheet('Importar arquivo', `
      <p style="margin-top:0;">${plural(ok.length, 'robô', 'robôs').replace(/^\d+/, '<strong>$&</strong>')} de ${plural(nTeams, 'equipe', 'equipes').replace(/^\d+/, '<strong>$&</strong>')} ${ok.length === 1 ? 'pronto' : 'prontos'} para cadastrar` +
      (bad ? ` · <span style="color:var(--danger);">${bad === 1 ? '1 linha com problema será ignorada' : bad + ' linhas com problema serão ignoradas'}</span>` : '') + `.</p>
      <p class="muted hint">Equipes e robôs que já existem são ignorados (não duplicam).</p>
      <div class="import-preview"><table>
        <thead><tr><th>#</th><th>Equipe</th><th>Robô</th><th>Código</th><th>Situação</th></tr></thead>
        <tbody>${rows.map((r, i) => `<tr class="${r.error ? 'bad' : ''}"><td>${i + 1}</td><td>${escapeHtml(r.team)}</td>` +
          `<td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.code)}</td><td>${r.error ? escapeHtml(r.error) : '<span class="import-ok">ok</span>'}</td></tr>`).join('')}</tbody>
      </table></div>
      <div class="btn-row">
        <button class="btn-ghost" type="button" id="import-back-btn">Outro arquivo</button>
        <button class="btn-primary" type="button" id="import-confirm-btn" ${ok.length === 0 ? 'disabled' : ''}>Cadastrar ${plural(ok.length, 'robô', 'robôs')}</button>
      </div>`, (body) => {
      body.querySelector('#import-back-btn').addEventListener('click', () => openImportSheet(null));
      body.querySelector('#import-confirm-btn').addEventListener('click', () => {
        withBusy(async () => {
          const participants = ok.map(r => ({ team: r.team, name: r.name, code: r.code }));
          const res = await api('POST', '/participants/import', { participants });
          closeSheet();
          const partsMsg = [];
          if (res.participants_created) partsMsg.push(plural(res.participants_created, 'robô cadastrado', 'robôs cadastrados'));
          if (res.teams_created) partsMsg.push(plural(res.teams_created, 'equipe nova', 'equipes novas'));
          if (res.participants_existing) partsMsg.push(plural(res.participants_existing, 'já existia e foi ignorado', 'já existiam e foram ignorados'));
          if (res.failed) partsMsg.push(plural(res.failed, 'não cadastrado', 'não cadastrados') + ': o cronômetro chegou ao limite de robôs');
          ui.msg = { text: 'Importação concluída: ' + (partsMsg.join(', ') || 'nada a fazer') + '.', warn: res.failed > 0 };
          rerender();
        });
      });
    });
  }

  // ---------------- Eventos ----------------
  const teamById = (id) => teams.find(t => t.id === id);
  const partById = (id) => parts.find(p => p.id === id);

  listBox.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    const teamId = parseInt(b.dataset.team, 10);
    const partId = parseInt(b.dataset.part, 10);
    if (act === 'toggle') { ui.open[teamId] = !ui.open[teamId]; drawList(); }
    else if (act === 'search-toggle') { ui.searchOpen[teamId] = !ui.searchOpen[teamId]; drawList(); }
    else if (act === 'rename') openRenameTeamSheet(teamById(teamId));
    else if (act === 'edit') openEditRobotSheet(partById(partId));
    else if (act === 'add') openAddRobotSheet(teamById(teamId));
    else if (act === 'delete-team') openDeleteTeamSheet(teamById(teamId));
    else if (act === 'delete') {
      // Primeiro pergunta ao ESP32 quanto vai sumir, pra confirmação mostrar.
      withBusy(async () => {
        const sum = await api('GET', '/participants/' + partId + '/runs-summary');
        openDeleteRobotSheet(partById(partId), sum);
      });
    }
  });

  const search = document.getElementById('roster-search');
  search.addEventListener('input', () => {
    ui.search = search.value;
    if (ui.search.trim() === '') ui.searchOpen = {}; // próxima busca começa com tudo fechado
    drawList();
  });

  document.getElementById('new-team-btn').addEventListener('click', openNewTeamSheet);
  document.getElementById('import-btn').addEventListener('click', () => openImportSheet(null));
}

// ------------------- Inscritos da competição -------------------
// Só inscreve/remove. Corrigir nome/equipe é em "Equipes e robôs".

let inscritosOpen = {}; // equipe aberta na lista de inscritos, por id de equipe
let justCreatedCompetitionId = null; // competição recém-criada -> "Adicionar robôs" mostra o aviso

async function renderCompetitionParticipants(root, competitionId) {
  let comp, linked, teams;
  try {
    [comp, linked, teams] = await Promise.all([
      api('GET', '/competitions/' + competitionId),
      api('GET', '/competitions/' + competitionId + '/participants'),
      api('GET', '/teams'),
    ]);
  } catch (e) {
    root.innerHTML = '<a class="back" href="#/competitions">&larr; Competições</a><p>' + escapeHtml(e.message) + '</p>';
    return;
  }
  const groups = groupByTeam(teams, linked).filter(g => g.robots.length > 0);
  const flash = takeFlash('insc-' + competitionId);

  function draw() {
    const list = groups.map(g => {
      const isOpen = !!inscritosOpen[g.team.id];
      const rows = isOpen ? `<div class="team-body">${g.robots.map(p => `
        <div class="robot-row">
          <span class="avatar">${initials(p.name)}</span><span class="rn">${escapeHtml(p.name)}</span>
          <button class="link-btn" data-act="remove" data-part="${p.id}">remover</button>
        </div>`).join('')}</div>` : '';
      return `<div class="team-card"><div class="team-head">
          <button class="team-toggle" data-act="toggle" data-team="${g.team.id}" aria-expanded="${isOpen}">
            ${chevronSvg(isOpen)}<span class="tn">${escapeHtml(g.team.name)}</span><span class="tc">${plural(g.robots.length, 'robô', 'robôs')}</span>
          </button></div>${rows}</div>`;
    }).join('');

    root.innerHTML = `
      <a class="back" href="#/competitions/${competitionId}">&larr; ${escapeHtml(comp.name)}</a>
      <h1>Inscritos</h1>
      <p class="muted page-sub">${escapeHtml(comp.name)} · ${plural(linked.length, 'robô inscrito', 'robôs inscritos')} em ${plural(groups.length, 'equipe', 'equipes')}</p>
      ${flash}
      <a class="btn-primary btn-link" href="#/competitions/${competitionId}/participants/add" style="margin-bottom:14px;">+ Adicionar robôs</a>
      ${linked.length === 0 ? `<div class="panel" style="text-align:center;">
          <p style="margin:4px 0; font-weight:700;">Nenhum robô inscrito ainda</p>
          <p class="muted hint" style="margin:0;">Use "Adicionar robôs" para escolher entre os robôs cadastrados.</p>
        </div>` : `<div id="insc-list">${list}</div>`}
      <p class="muted hint">Nome ou equipe errados? Corrija em <a href="#/roster">Equipes e robôs</a>.</p>
      <a class="btn-ghost btn-link" href="#/competitions/${competitionId}">Concluir</a>
    `;
    const box = document.getElementById('insc-list');
    if (!box) return;
    box.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'toggle') {
        const id = parseInt(b.dataset.team, 10);
        inscritosOpen[id] = !inscritosOpen[id];
        draw();
      } else if (b.dataset.act === 'remove') {
        if (!confirm('Remover este robô da competição? Ele continua no cadastro.')) return;
        withBusy(async () => {
          await api('DELETE', '/competitions/' + competitionId + '/participants/' + b.dataset.part);
          renderCompetitionParticipants(root, competitionId);
        });
      }
    });
  }
  draw();
}

async function renderCompetitionAdd(root, competitionId) {
  let comp, linked, all, teams;
  try {
    [comp, linked, all, teams] = await Promise.all([
      api('GET', '/competitions/' + competitionId),
      api('GET', '/competitions/' + competitionId + '/participants'),
      api('GET', '/participants'),
      api('GET', '/teams'),
    ]);
  } catch (e) {
    root.innerHTML = '<a class="back" href="#/competitions">&larr; Competições</a><p>' + escapeHtml(e.message) + '</p>';
    return;
  }
  const isNew = justCreatedCompetitionId === competitionId;
  justCreatedCompetitionId = null;
  const inscritos = new Set(linked.map(p => p.id));
  const groups = groupByTeam(teams, all).filter(g => g.robots.length > 0);
  const selected = new Set();
  const open = {};
  let searchOpen = {}; // equipes abertas dentro dos resultados da busca
  let search = '';

  root.innerHTML = `
    <a class="back" href="#/competitions/${competitionId}/participants">&larr; Inscritos</a>
    ${isNew ? `<div class="import-msg">Competição <strong>${escapeHtml(comp.name)}</strong> criada. Agora marque os robôs que vão participar.</div>` : ''}
    <h1>Adicionar robôs</h1>
    <p class="muted page-sub">${escapeHtml(comp.name)} · marque robôs ou a equipe inteira</p>
    ${all.length === 0 ? `<div class="panel">
        <p style="margin-top:0; font-weight:700;">Nenhum robô cadastrado ainda</p>
        <p class="muted hint">Cadastre as equipes e robôs (ou importe uma planilha) em Equipes e robôs e depois volte aqui.</p>
        <a class="btn-primary btn-link" href="#/roster">Ir para Equipes e robôs</a>
      </div>` : `
      <input id="add-search" type="search" placeholder="Buscar robô ou equipe" aria-label="Buscar robô ou equipe">
      <div id="add-list" style="margin-top:12px;"></div>`}
    <div class="bottom-bar">
      <a class="btn-ghost btn-link" href="#/competitions/${competitionId}/participants">${isNew ? 'Fazer depois' : 'Cancelar'}</a>
      <button class="btn-primary" id="add-confirm" disabled>Adicionar</button>
    </div>
  `;
  const confirmBtn = document.getElementById('add-confirm');
  const listBox = document.getElementById('add-list');
  if (!listBox) return;

  function available(g) { return g.robots.filter(p => !inscritos.has(p.id)); }

  // No celular, SÓ a caixinha marca - equipe inteira ou um
  // robô. Tocar em qualquer outro lugar da linha da equipe abre/fecha os
  // robôs dela (a setinha fica só como indicador).
  function teamCheckbox(g) {
    const avail = available(g);
    const allChecked = avail.length > 0 && avail.every(p => selected.has(p.id));
    return `<label class="chk-hit" aria-label="Marcar a equipe inteira"><input type="checkbox" class="chk" data-act="team" data-team="${g.team.id}" ` +
      `${allChecked || avail.length === 0 ? 'checked' : ''} ${avail.length === 0 ? 'disabled' : ''}></label>`;
  }
  function availLabel(g) {
    const n = available(g).length;
    return n === 0 ? 'todos inscritos' : plural(n, 'disponível', 'disponíveis');
  }
  function robotCheckRow(p, nameHtml, meta) {
    const inscrito = inscritos.has(p.id);
    return `<div class="robot-row">
          <label class="chk-hit" aria-label="Marcar ${escapeHtml(p.name)}"><input type="checkbox" class="chk" data-act="robot" data-part="${p.id}" ${inscrito || selected.has(p.id) ? 'checked' : ''} ${inscrito ? 'disabled' : ''}></label>
          <span class="rn" ${inscrito ? 'style="color:var(--text-dim);"' : ''}>${nameHtml}</span>
          ${meta ? `<span class="p-meta">${meta}</span>` : ''}
          ${inscrito ? '<span class="badge">já inscrito</span>' : ''}
        </div>`;
  }

  function draw() {
    let html;
    if (search.trim() !== '') {
      const res = searchRoster(groups, search);
      html = '';
      if (res.robots.length) {
        html += `<h2 class="results-h">Robôs</h2><div class="team-card"><div class="team-body" style="border-top:none;">` +
          res.robots.map(x => robotCheckRow(x.p, highlightMatch(x.p.name, search), escapeHtml(x.team.name))).join('') + '</div></div>';
      }
      if (res.teams.length) {
        // A equipe abre ali mesmo, sem sair da busca.
        html += `<h2 class="results-h">Equipes</h2>` + res.teams.map(g => {
          const isOpen = !!searchOpen[g.team.id];
          const rows = isOpen ? `<div class="team-body" style="padding-top:0;">${g.robots.map(p => robotCheckRow(p, escapeHtml(p.name), '')).join('')}</div>` : '';
          return `<div class="team-card"><div class="team-head">
              ${teamCheckbox(g)}
              <button class="team-toggle" data-act="search-toggle" data-team="${g.team.id}" aria-expanded="${isOpen}">
                <span class="tn">${highlightMatch(g.team.name, search)}</span><span class="tc">${availLabel(g)}</span>${chevronSvg(isOpen)}
              </button>
            </div>${rows}</div>`;
        }).join('');
      }
      if (!html) html = `<p class="muted">Nenhum robô ou equipe começa com "${escapeHtml(search.trim())}".</p>`;
    } else {
      html = groups.map(g => {
        const isOpen = !!open[g.team.id];
        const rows = isOpen ? `<div class="team-body" style="padding-top:0;">${g.robots.map(p => robotCheckRow(p, escapeHtml(p.name), '')).join('')}</div>` : '';
        return `<div class="team-card"><div class="team-head">
            ${teamCheckbox(g)}
            <button class="team-toggle" data-act="toggle" data-team="${g.team.id}" aria-expanded="${isOpen}">
              <span class="tn">${escapeHtml(g.team.name)}</span><span class="tc">${availLabel(g)}</span>${chevronSvg(isOpen)}
            </button>
          </div>${rows}</div>`;
      }).join('');
    }
    listBox.innerHTML = html;
    confirmBtn.disabled = selected.size === 0;
    confirmBtn.textContent = selected.size === 0 ? 'Adicionar' : 'Adicionar ' + plural(selected.size, 'robô', 'robôs');
  }
  draw();

  listBox.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act="toggle"], [data-act="search-toggle"]');
    if (!b) return;
    const id = parseInt(b.dataset.team, 10);
    if (b.dataset.act === 'toggle') open[id] = !open[id];
    else searchOpen[id] = !searchOpen[id];
    draw();
  });
  listBox.addEventListener('change', (e) => {
    const el = e.target;
    if (el.dataset.act === 'robot') {
      const id = parseInt(el.dataset.part, 10);
      if (el.checked) selected.add(id); else selected.delete(id);
    } else if (el.dataset.act === 'team') {
      // Equipe inteira = todos os robôs dela ainda não inscritos (mesmo os escondidos pela busca).
      const g = groups.find(x => x.team.id === parseInt(el.dataset.team, 10));
      available(g).forEach(p => { if (el.checked) selected.add(p.id); else selected.delete(p.id); });
    }
    draw();
  });
  document.getElementById('add-search').addEventListener('input', (e) => {
    search = e.target.value;
    if (search.trim() === '') searchOpen = {}; // próxima busca começa com tudo fechado
    draw();
  });

  confirmBtn.addEventListener('click', () => {
    if (selected.size === 0) return;
    withBusy(async () => {
      const res = await api('POST', '/competitions/' + competitionId + '/participants', { participant_ids: [...selected] });
      flashMsg = {
        key: 'insc-' + competitionId,
        text: plural(res.added, 'robô adicionado', 'robôs adicionados') + ' à competição.' +
          (res.capacity_reached ? ' Limite de inscrições do cronômetro atingido: alguns ficaram de fora.' : ''),
        warn: !!res.capacity_reached,
      };
      location.hash = '#/competitions/' + competitionId + '/participants';
    });
  });
}

// ------------------- Tela de operação (detalhe da competição) -------------------

async function renderCompetitionDetail(root, id) {
  root.innerHTML = '<p class="muted">Carregando...</p>';
  lastPendingSeen = undefined; // primeira atualização desta tela não vibra
  lastAnnounced = ''; // nem anuncia
  lastVerdict = null;
  activeDetailTab = 'ranking'; // reseta ao entrar numa competição (evita herdar aba de uma visita anterior)
  const ok = await refreshDetail(root, id);
  // Pula o tick do polling enquanto uma ação (doValidate/doArm/etc, via
  // withBusy) estiver em andamento — sem isso, a resposta do polling
  // periódico podia chegar DEPOIS da resposta da ação (o ESP32 atende
  // uma requisição por vez, então a ordem de chegada não é garantida) e
  // sobrescrever a tela já atualizada com o estado antigo, dando a
  // impressão de que o clique não fez nada (era preciso clicar de novo).
  //
  // Cada celular aberto aqui pergunta ao mesmo ESP32 que mede o tempo:
  // rápido só com corrida em jogo; fora disso (escolhendo robô, dia
  // concluído) 1 a cada 3 rodadas; com a aba escondida, nada.
  let tick = 0;
  if (ok) pollTimer = setInterval(() => {
    tick++;
    if (document.hidden || busy || document.activeElement?.id === 'participant-search') return;
    if (!LIVE_PHASES.has(lastPhase) && tick % 3) return;
    refreshDetail(root, id);
  }, 1500);
}
const LIVE_PHASES = new Set(['locked', 'waiting_start', 'running', 'validate']);
let lastPhase = '';

// Guarda de sequência: se duas chamadas a refreshDetail estiverem em voo
// ao mesmo tempo (ex.: o polling disparou bem no instante em que uma
// ação também chamou refreshDetail), só a resposta da chamada MAIS
// RECENTE pode atualizar a tela — descarta qualquer resposta atrasada de
// uma chamada mais antiga, nunca deixa o mais velho sobrescrever o mais
// novo. Reforça a proteção do "if (!busy)" acima para qualquer overlap
// que escape dela.
let refreshSeq = 0;

async function refreshDetail(root, id) {
  const mySeq = ++refreshSeq;
  let competition, dayStatus, armState, ranking, runs;
  try {
    [competition, dayStatus, armState, ranking, runs] = await Promise.all([
      api('GET', '/competitions/' + id),
      api('GET', '/competitions/' + id + '/day-status'),
      api('GET', '/arm'),
      api('GET', '/competitions/' + id + '/ranking'),
      api('GET', '/competitions/' + id + '/runs'),
    ]);
  } catch (e) {
    if (mySeq !== refreshSeq) return false; // resposta atrasada - descarta
    // Falha passageira com a tela já montada: mantém a última tela (a faixa
    // vermelha avisa) e a próxima atualização a corrige sozinha.
    if (root.querySelector('.detail-title')) return false;
    root.innerHTML = '<a class="back" href="#/">&larr; Início</a><p>' + escapeHtml(e.message) + '</p>';
    return false;
  }
  if (mySeq !== refreshSeq) return false; // resposta atrasada - descarta
  ctx = { competitionId: id, currentDay: dayStatus.current_day, finished: competition.status === 'finished', name: competition.name };
  lastRuns = runs;
  lastRanking = ranking.ranking;
  const derived = derivePhase(competition, dayStatus, armState, runs);
  lastPhase = derived.phase;
  vibrateOnNewResult(derived);
  announcePhase(derived, armState, dayStatus);
  setDisplayContext('competition', id, derived.phase);
  const html = renderDetailHtml(competition, dayStatus, armState, ranking, runs);
  // Nada mudou (o caso comum do polling): não refaz a tela, então foco,
  // seleção e listas abertas ficam onde estão.
  if (html !== lastDetailHtml || !root.querySelector('.detail-title')) {
    const focus = focusSnapshot(root);
    root.innerHTML = html;
    lastDetailHtml = html;
    applyDetailTab(); // reaplica a aba ativa (o innerHTML acima sempre volta pro estado "padrão" do HTML)
    focusRestore(root, focus);
  }
  syncLiveTimer(armState);
  return true;
}
let lastDetailHtml = '';

// Refazer a tela destrói o elemento com foco; guarda qual era (pelo que ele
// faz/diz) para devolver o foco ao equivalente na tela nova.
const FOCUSABLE = 'button, a[href], summary, input, select';
function focusSnapshot(root) {
  const el = document.activeElement;
  if (!el || el === document.body || !root.contains(el)) return null;
  return { act: el.getAttribute('onclick') || el.id || '', text: el.textContent.trim() };
}
function focusRestore(root, f) {
  if (!f) return;
  const all = [...root.querySelectorAll(FOCUSABLE)];
  const el = all.find(e => f.act && (e.getAttribute('onclick') || e.id || '') === f.act)
    || all.find(e => e.textContent.trim() === f.text);
  if (el) el.focus({ preventScroll: true });
}

// Leitor de tela: avisa quando a fase da corrida muda (não a cada tique do tempo).
let lastAnnounced = '';
function announcePhase(derived, armState, dayStatus) {
  const name = derived.pendingRun ? derived.pendingRun.participant_name : armState.participant_name;
  const msg = {
    finished: 'Competição encerrada.',
    validate: derived.pendingRun && `Resultado para validar: ${name}, ${formatElapsed(derived.pendingRun.elapsed_us)}.`,
    day_complete: `Dia ${dayStatus.current_day} concluído.`,
    locked: `Pronto para liberar: ${name}.`,
    waiting_start: `Corrida liberada: ${name}. Aguardando largada.`,
    running: `Corrida em andamento: ${name}.`,
    select: 'Escolher robô.',
  }[derived.phase] || '';
  if (msg === lastAnnounced) return;
  const first = lastAnnounced === '';
  lastAnnounced = msg;
  if (!first) document.getElementById('sr-status').textContent = msg; // ao abrir a tela, o próprio conteúdo já informa
}

// Vibra o celular (Android; o iPhone não deixa) quando aparece um resultado
// novo para validar. Não vibra ao abrir a tela com um resultado já esperando.
let lastPendingSeen;
function vibrateOnNewResult(derived) {
  const id = derived.phase === 'validate' ? String(derived.pendingRun.event_id || derived.pendingRun.id) : '';
  if (id && lastPendingSeen !== undefined && id !== lastPendingSeen &&
      typeof navigator !== 'undefined' && navigator.vibrate) navigator.vibrate([200, 100, 200]);
  lastPendingSeen = id;
}

// Planilha do ranking: abre no Excel em português (ponto e vírgula + BOM).
let lastRanking = [];
function rankingCsv(rows) {
  const cell = (v) => /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  const maxAtt = rows.reduce((m, r) => Math.max(m, r.attempts.length), 0);
  const head = ['Posição', 'Robô', 'Equipe', 'Melhor tempo'];
  for (let i = 0; i < maxAtt; i++) {
    const a = rows.map(r => r.attempts[i]).find(Boolean);
    head.push(a && a.day ? `Dia ${a.day} tomada ${a.attempt}` : `Tomada ${i + 1}`);
  }
  const lines = rows.map(r => {
    const hasBest = r.best_elapsed_us != null && r.best_elapsed_us >= 0;
    const atts = Array.from({ length: maxAtt }, (_, i) => {
      const a = r.attempts[i];
      if (!a) return '';
      if (a.status === 'dnf') return 'Não completou';
      const t = formatElapsed(a.elapsed_us);
      return a.status === 'valid' ? t : a.status === 'invalid' ? t + ' (inválida)' : t + ' (aguardando)';
    });
    return [r.position + 'º', r.participant_name, r.team_name || '', hasBest ? formatElapsed(r.best_elapsed_us) : 'sem tempo', ...atts].map(cell).join(';');
  });
  return '\uFEFF' + [head.map(cell).join(';'), ...lines].join('\r\n') + '\r\n';
}
window.downloadRankingCsv = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rankingCsv(lastRanking)], { type: 'text/csv;charset=utf-8' }));
  a.download = (normalizeKey(ctx.name || 'competicao').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'competicao') + '_ranking.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

// Tempo correndo no celular: o ESP manda quanto já passou a
// cada atualização; entre elas a página conta sozinha. O oficial é o do ESP.
let liveBase = null;
let liveTick = null;
function syncLiveTimer(armState) {
  if (armState.armed && armState.started && armState.elapsed_us != null) {
    liveBase = { us: armState.elapsed_us, at: performance.now() };
    if (!liveTick) liveTick = setInterval(() => {
      const el = document.getElementById('live-timer');
      if (!el || !liveBase) { clearInterval(liveTick); liveTick = null; return; }
      el.textContent = formatElapsed(liveBase.us + (performance.now() - liveBase.at) * 1000);
    }, 50);
  } else {
    liveBase = null;
  }
}

// Corrigir o resultado de uma corrida já decidida.
let lastRuns = [];
window.openRunSheet = (runId) => {
  const r = lastRuns.find(x => x.id === runId);
  if (!r) return;
  const choices = [['valid', 'Válida', 'btn-primary'], ['invalid', 'Inválida', 'btn-danger'], ['dnf', 'Não completou', 'btn-ghost']]
    .filter(c => c[0] !== r.status);
  openSheet('Corrigir resultado', `
    <p class="phase-who"><strong>${escapeHtml(r.participant_name)}</strong> <small>· Dia ${r.day}, tomada ${r.attempt}</small></p>
    <p class="time-display" style="font-size:2.4rem; margin:8px 0;">${r.status === 'dnf' ? 'Sem tempo' : formatElapsed(r.elapsed_us)}</p>
    <p class="muted hint">Está como <strong>${STATUS_LABELS[r.status] || r.status}</strong>. Mudar para:</p>
    <div class="fix-choices">${choices.map(c => `<button class="${c[2]}" type="button" data-st="${c[0]}">${c[1]}</button>`).join('')}</div>
    <button class="btn-ghost" type="button" data-sheet-close>Cancelar</button>`, (body) => {
    body.querySelectorAll('[data-st]').forEach(b => b.addEventListener('click', () => withBusy(async () => {
      await api('PATCH', '/runs/' + r.id + '/validation', { status: b.dataset.st, event_id: r.event_id || '', correction: true });
      lastVerdict = null; // a faixa mostraria o veredito antigo
      closeSheet();
      await refreshDetail(document.getElementById('app'), ctx.competitionId);
    })));
  });
};

function derivePhase(competition, dayStatus, armState, runs) {
  if (competition.status === 'finished') return { phase: 'finished' };
  const pendingRun = runs.find(r => r.status === 'pending_validation');
  if (pendingRun) return { phase: 'validate', pendingRun };
  // Robô armado vem ANTES de "dia concluído": se o ESP32 armou
  // alguém (ex.: tomada repetida), é isso que o juiz precisa ver.
  if (armState.armed && !armState.released) return { phase: 'locked' };
  if (armState.armed && armState.released && !armState.started) return { phase: 'waiting_start' };
  if (armState.armed && armState.released && armState.started) return { phase: 'running' };
  if (dayStatus.day_complete) return { phase: 'day_complete' };
  return { phase: 'select' };
}

function renderPhasePanel(competition, dayStatus, armState, derived) {
  const p = derived.phase;
  const who = (name, day, attempt) => `<p class="phase-who"><strong>${escapeHtml(name)}</strong> <small>Dia ${day}, tomada ${attempt}</small></p>`; // nome em linha própria (ver .phase .phase-who strong)

  if (p === 'finished') {
    return `<div class="panel"><h2>Encerrada</h2><p>Competição encerrada. Veja o ranking final abaixo.</p></div>`;
  }

  if (p === 'validate') {
    const r = derived.pendingRun;
    const ev = escapeHtml(r.event_id || '');
    return `<div class="panel phase" data-phase="validate">
      <h2 class="phase-title">Validar resultado</h2>
      ${who(r.participant_name, r.day, r.attempt)}
      <p class="time-display time-stopped">${formatElapsed(r.elapsed_us)}</p>
      <div class="btn-row verdict-row">
        <button class="btn-valid" onclick="doValidate(${r.id}, 'valid', '${ev}')">Válida</button>
        <button class="btn-danger" onclick="doValidate(${r.id}, 'invalid', '${ev}')">Inválida</button>
      </div>
      <div class="phase-alt">
        <button class="btn-ghost" onclick="doValidate(${r.id}, 'retry', '${ev}')">Repetir tomada</button>
      </div>
    </div>`;
  }

  if (p === 'day_complete') {
    const label = dayStatus.is_last_day ? 'Encerrar competição' : ('Iniciar Dia ' + (dayStatus.current_day + 1));
    return `<div class="panel">
      <h2>Dia ${dayStatus.current_day} concluído</h2>
      <button class="btn-primary" onclick="doAdvanceDay(${dayStatus.is_last_day})">${label} &rarr;</button>
    </div>`;
  }

  if (p === 'locked') {
    return `<div class="panel phase" data-phase="locked">
      <h2 class="phase-title">Pronto para liberar</h2>
      ${who(armState.participant_name, armState.day, armState.attempt)}
      <button class="btn-primary" onclick="doRelease()">Liberar corrida</button>
      <button class="btn-ghost" onclick="doDisarm()">Trocar robô</button>
      <div class="phase-alt">
        <button class="btn-ghost danger-outline" onclick="doNoShow()">Não compareceu</button>
      </div>
    </div>`;
  }

  if (p === 'waiting_start') {
    return `<div class="panel phase" data-phase="waiting_start">
      <h2 class="phase-title"><span class="live-dot" aria-hidden="true"></span> Aguardando largada</h2>
      ${who(armState.participant_name, armState.day, armState.attempt)}
      <p class="muted" style="margin:0;">Liberado: o tempo começa quando o robô passar pelo sensor de largada.</p>
      <button class="btn-ghost" onclick="doDisarm()">Trocar robô</button>
      <div class="phase-alt">
        <button class="btn-ghost danger-outline" onclick="doNoShow()">Não compareceu</button>
      </div>
    </div>`;
  }

  if (p === 'running') {
    return `<div class="panel phase" data-phase="running">
      <h2 class="phase-title"><span class="live-dot" aria-hidden="true"></span> Corrida em andamento</h2>
      ${who(armState.participant_name, armState.day, armState.attempt)}
      <p class="time-display live" id="live-timer">${formatElapsed(armState.elapsed_us != null ? armState.elapsed_us : 0)}</p>
      <div class="phase-alt">
        <button class="btn-ghost" onclick="doRetry()">Repetir tomada</button>
        <button class="btn-ghost danger-outline" onclick="doAbort()">Abortar</button>
      </div>
    </div>`;
  }

  // select
  const pending = dayStatus.participants.filter(x => !x.done);
  const done = dayStatus.participants.filter(x => x.done);
  if (dayStatus.participants.length === 0) {
    return `<div class="panel"><h2>Escolher robô</h2><p class="muted">Nenhum robô inscrito nesta competição. Use o botão "Inscritos" acima.</p></div>`;
  }
  lastPendingList = pending;
  return `<div class="panel">
    <h2>Escolher robô</h2>
    <input id="participant-search" type="search" aria-label="Buscar robô" placeholder="Buscar robô..." value="${escapeHtml(participantFilterText)}" oninput="filterParticipants(this.value)" style="margin-bottom:10px; width:100%;">
    <div class="participant-list pick-list" id="participant-list-box">
      ${renderParticipantButtons(pending, participantFilterText)}
    </div>
    ${done.length ? `<details style="margin-top:14px;"><summary>Já terminaram o dia (${done.length})</summary>
      <ul class="runs-list">${[...done].sort((a, b) => a.name.localeCompare(b.name)).map(x => `<li><span style="display:flex;align-items:center;gap:10px;"><span class="avatar">${initials(x.name)}</span>${escapeHtml(x.name)}</span></li>`).join('')}</ul>
    </details>` : ''}
  </div>`;
}

function renderDetailHtml(competition, dayStatus, armState, ranking, runs) {
  const derived = derivePhase(competition, dayStatus, armState, runs);
  const runsSorted = runs.slice().reverse();
  const backHref = competition.status === 'finished' ? '#/history' : '#/competitions';
  const backLabel = competition.status === 'finished' ? 'Histórico' : 'Competições';

  // Nome, selo do dia e ações em linhas próprias (antes o "Dia X
  // de Y" ficava por baixo dos botões no celular); "Painel" (o antigo
  // "Tela cheia" do ranking) fica junto das outras ações.
  const finished = competition.status === 'finished';
  return `
    <a class="back" href="${backHref}">&larr; ${backLabel}</a>
    <div class="title-row">
      <h1 class="detail-title">${escapeHtml(competition.name)}</h1>
      <a class="icon-btn" href="#/competitions/${competition.id}/edit" title="Editar competição" aria-label="Editar competição"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></a>
    </div>
    <span class="day-pill">${finished ? 'Encerrada' : `Dia ${dayStatus.current_day} de ${dayStatus.num_days}`}</span>
    <div class="detail-actions">
      <a class="btn-ghost btn-accent" href="#/competitions/${competition.id}/ranking-tv" target="_blank" rel="noopener" aria-label="Painel para o público, abre em outra aba">Painel (TV)</a>
      ${finished ? '' : `<a class="btn-ghost" href="#/competitions/${competition.id}/participants">Inscritos</a>`}
    </div>

    <div class="detail-grid">
    <div class="dg-phase">${renderVerdictBar()}${renderPhasePanel(competition, dayStatus, armState, derived)}</div>

    <div class="tabs-bar">
      <button class="tab-btn" id="tab-btn-ranking" onclick="switchDetailTab('ranking')">Ranking</button>
      <button class="tab-btn" id="tab-btn-runs" onclick="switchDetailTab('runs')">Corridas recentes</button>
    </div>

    <div id="tab-ranking" class="panel dg-rank">
      <h2 class="desk-only">Ranking</h2>
      ${renderRankingList(ranking.ranking)}
      ${ranking.ranking.length ? '<div class="panel-foot"><button class="link-btn link-primary" type="button" onclick="downloadRankingCsv()">Baixar planilha do ranking</button></div>' : ''}
    </div>

    <div id="tab-runs" class="panel dg-runs">
      <h2 class="desk-only">Corridas recentes</h2>
      ${runsSorted.length === 0 ? '<p class="muted">Nenhuma corrida ainda.</p>' : `${finished ? '' : '<p class="muted hint" style="margin:0 0 4px;">Toque numa corrida para corrigir o resultado.</p>'}<ul class="runs-list">` +
        runsSorted.map(r => {
          const inner = `<span class="r-name">${escapeHtml(r.participant_name)}<small>Dia ${r.day} · tomada ${r.attempt}</small></span>` +
            `<span class="r-time">${r.status === 'dnf' ? '' : formatElapsed(r.elapsed_us)}</span>` +
            `<span class="badge ${STATUS_CLASS[r.status] || ''}">${STATUS_LABELS[r.status] || r.status}</span>`;
          const canFix = !finished && r.id >= 0 && ['valid', 'invalid', 'dnf'].includes(r.status);
          return `<li class="run-li">${canFix ? `<button class="run-row" onclick="openRunSheet(${r.id})">${inner}</button>` : `<div class="run-row">${inner}</div>`}</li>`;
        }).join('') + `</ul>`}
    </div>
    </div>
  `;
}

// Preserva a aba ativa entre atualizações (o polling reescreve o HTML
// inteiro a cada 1.5s - sem isso, quem estivesse na aba "Corridas
// Recentes" veria a tela voltar sozinha pra "Ranking" a cada atualização).
let activeDetailTab = 'ranking';

function applyDetailTab() {
  const rankingPanel = document.getElementById('tab-ranking');
  const runsPanel = document.getElementById('tab-runs');
  const rankingBtn = document.getElementById('tab-btn-ranking');
  const runsBtn = document.getElementById('tab-btn-runs');
  if (!rankingPanel || !runsPanel || !rankingBtn || !runsBtn) return; // fora da tela de detalhe (ex.: erro de carregamento)
  rankingPanel.style.display = activeDetailTab === 'ranking' ? '' : 'none';
  runsPanel.style.display = activeDetailTab === 'runs' ? '' : 'none';
  rankingBtn.classList.toggle('tab-active', activeDetailTab === 'ranking');
  runsBtn.classList.toggle('tab-active', activeDetailTab === 'runs');
}

window.switchDetailTab = (tab) => {
  activeDetailTab = tab;
  applyDetailTab();
};

window.doArm = (participantId, attempt) => withBusy(async () => {
  await api('POST', '/arm', { competition_id: ctx.competitionId, participant_id: participantId, day: ctx.currentDay, attempt });
  await refreshDetail(document.getElementById('app'), ctx.competitionId);
});
window.doRelease = () => withBusy(async () => {
  await api('POST', '/arm/release');
  await refreshDetail(document.getElementById('app'), ctx.competitionId);
});
// Volta para a escolha do robô (selecionou errado).
window.doDisarm = () => withBusy(async () => {
  await api('DELETE', '/arm');
  await refreshDetail(document.getElementById('app'), ctx.competitionId);
});
// Robô que não veio: a tomada conta como Não completou e o cronômetro já
// seleciona a próxima tomada dele (ver handlePostArmNoShow no firmware).
window.doNoShow = () => {
  if (!confirm('Registrar que o robô não compareceu? Esta tomada conta como Não completou.')) return;
  withBusy(async () => {
    await api('POST', '/arm/no-show');
    await refreshDetail(document.getElementById('app'), ctx.competitionId);
  });
};
window.doAbort = () => {
  if (!confirm('Abortar esta corrida? Ela fica registrada como Não completou.')) return;
  withBusy(async () => {
    await api('POST', '/arm/abort');
    await refreshDetail(document.getElementById('app'), ctx.competitionId);
  });
};
window.doRetry = () => {
  if (!confirm('Repetir esta tomada? A corrida em andamento é descartada e o robô corre de novo.')) return;
  withBusy(async () => {
    await api('POST', '/arm/retry');
    await refreshDetail(document.getElementById('app'), ctx.competitionId);
  });
};
window.doValidate = (runId, status, eventId) => {
  // Repetir apaga o tempo medido e não tem correção depois - só ele confirma.
  if (status === 'retry' && !confirm('Repetir esta tomada? O tempo medido será descartado e o robô corre de novo.')) return;
  const run = lastRuns.find(x => x.id === runId);
  withBusy(async () => {
  try {
    await api('PATCH', '/runs/' + runId + '/validation', { status, event_id: eventId || '' });
    if (run && status !== 'retry') {
      lastVerdict = { runId, status, name: run.participant_name, time: formatElapsed(run.elapsed_us), until: Date.now() + VERDICT_BAR_MS };
    }
  } finally {
    // Mesmo se o ESP32 recusar (lista de corridas mudou),
    // atualiza a tela pra o juiz ver a situação real antes de tentar de novo.
    await refreshDetail(document.getElementById('app'), ctx.competitionId);
  }
  });
};

// Depois de Válida/Inválida a tela volta para "Escolher robô"; sem esta
// faixa o juiz não sabe se o toque contou. "Corrigir" abre a mesma
// correção de Corridas recentes. Some sozinha na próxima atualização.
const VERDICT_BAR_MS = 8000;
let lastVerdict = null;
function renderVerdictBar() {
  if (!lastVerdict || Date.now() > lastVerdict.until || !lastRuns.some(r => r.id === lastVerdict.runId)) return '';
  const v = lastVerdict;
  const ok = v.status === 'valid';
  return `<div class="verdict-bar ${ok ? 'is-valid' : 'is-invalid'}" role="status">
    <svg class="verdict-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ok ? '<path d="M5 12.5l4.5 4.5L19 7.5"/>' : '<path d="M6 6l12 12M18 6 6 18"/>'}</svg>
    <span class="verdict-text"><strong>${escapeHtml(v.name)}</strong> <span class="verdict-time">${v.time}</span> registrada como ${ok ? 'Válida' : 'Inválida'}</span>
    <button class="verdict-fix" type="button" onclick="openRunSheet(${v.runId})">Corrigir</button>
  </div>`;
}

window.doAdvanceDay = (isLastDay) => {
  const msg = isLastDay
    ? 'Encerrar esta competição? Não será possível registrar mais corridas depois disso.'
    : 'Avançar para o próximo dia? Não será possível voltar a registrar corridas do dia atual depois disso.';
  if (!confirm(msg)) return;
  withBusy(async () => {
    await api('POST', '/competitions/' + ctx.competitionId + '/advance-day');
    await refreshDetail(document.getElementById('app'), ctx.competitionId);
  });
};
</script>
</body>
</html>
