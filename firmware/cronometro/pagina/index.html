<!DOCTYPE html>
<!--
  Página do juiz (HTML/CSS/JS puro, sem build). Servida pelo ESP32 compactada:
  depois de editar este arquivo, rode ferramentas/gerar_pagina.py (ou gerar_pagina.bat)
  para regenerar web_page_gz.h, e só então compile/carregue no Arduino IDE.
  Funciona só com o Access Point do cronômetro: nada de CDN/fonte externa.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RaceTrack UTFPR</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffc700' stroke-width='2.4' stroke-linecap='round'%3E%3Ccircle cx='12' cy='14' r='8'/%3E%3Cpath d='M12 14v-4M10 2h4M12 2v4'/%3E%3C/svg%3E">
<script>try { if (localStorage.getItem('tema') === 'sol') document.documentElement.dataset.theme = 'sol'; } catch (e) {}</script>
<style>
:root {
  --bg:#07080c; --bg-elev:#0c0f16; --panel:#12151f; --panel-hover:#171b28;
  --border:#1f2431; --border-strong:#2d3446;
  --text:#f2f4f9; --text-dim:#99a2b8; --text-faint:#808aa0;
  --primary:#ffc700; --primary-strong:#e6b400; --primary-soft:rgba(255,199,0,.15); --primary-line:rgba(255,199,0,.45); --on-primary:#111; --primary-ink:var(--primary);
  --success:#34d399; --success-soft:rgba(52,211,153,.14); --on-success:#06281a;
  --danger:#ff5c7a; --danger-soft:rgba(255,92,122,.14); --danger-line:rgba(255,92,122,.45); --on-danger:#2a0610;
  --warning:#ffb545; --warning-soft:rgba(255,181,69,.14);
  --gold:#ffd166; --silver:#ccd6e6; --bronze:#e2a97a;
  --radius:18px; --radius-sm:12px;
  --shadow:0 14px 34px -16px rgba(0,0,0,.7);
  --shadow-sm:0 8px 18px -10px rgba(0,0,0,.55);
  --topbar-bg:rgba(7,8,12,.72);
  color-scheme:dark;
}
/* Modo Sol: claro e de alto contraste para luz forte (ginásio, sol, projetor
   em sala clara). Mesmos papéis; as cores de destaque ficam mais escuras
   onde viram texto, porque amarelo/verde claros somem no branco. */
:root[data-theme="sol"] {
  --bg:#f3f4f6; --bg-elev:#ffffff; --panel:#ffffff; --panel-hover:#eceef2;
  --border:#d5d9e1; --border-strong:#aeb5c2;
  --text:#0c1018; --text-dim:#3b4352; --text-faint:#545d6d;
  --primary-soft:rgba(255,199,0,.24); --primary-line:rgba(138,98,0,.55); --primary-ink:#7a5500;
  --success:#0a7148; --success-soft:rgba(10,113,72,.12); --on-success:#fff;
  --danger:#b3193a; --danger-soft:rgba(179,25,58,.10); --danger-line:rgba(179,25,58,.5); --on-danger:#fff;
  --warning:#8a4b00; --warning-soft:rgba(138,75,0,.12);
  --gold:#8a6200; --silver:#4f5968; --bronze:#8f4f1f;
  --shadow:0 10px 26px -14px rgba(16,24,40,.28);
  --shadow-sm:0 6px 14px -10px rgba(16,24,40,.3);
  --topbar-bg:rgba(255,255,255,.85);
  color-scheme:light;
}
* { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; }
body {
  margin:0; min-height:100vh; display:flex; flex-direction:column;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  letter-spacing:-.005em;
  background:var(--bg);
  color:var(--text);
}
a { color:var(--primary-ink); text-decoration:none; }
a:hover { text-decoration:underline; }

.topbar {
  position:sticky; top:0; z-index:10;
  display:flex; align-items:center; gap:10px;
  padding:16px 20px; background:var(--topbar-bg); backdrop-filter:blur(14px) saturate(160%);
  border-bottom:1px solid var(--border);
}
.topbar .logo { font-size:1.5rem; line-height:1; }
.topbar .brand { font-weight:700; font-size:1rem; letter-spacing:.01em; }
.topbar .brand small { display:block; font-weight:400; font-size:.72rem; color:var(--text-faint); margin-top:1px; }
/* Marca clicável, volta pro início - sem sublinhado no hover porque
   cobre logo+texto juntos, não é um link de frase comum. */
.topbar-home { display:flex; align-items:center; gap:10px; color:inherit; transition:opacity .15s; }
.topbar-home:hover { text-decoration:none; opacity:.8; }

.tabs-bar {
  display:flex; gap:2px; margin-bottom:16px; background:var(--bg-elev);
  padding:4px; border-radius:999px; border:1px solid var(--border);
}
.tab-btn {
  flex:1; border:none; background:transparent; color:var(--text-dim);
  border-radius:999px; min-height:44px; padding:11px 14px; font-size:.85rem; font-weight:700; cursor:pointer;
  transition:background .15s, color .15s;
}
.tab-btn:hover { color:var(--text); }
/* Cabeçalho da tela da competição */
.detail-title { margin:0 0 8px; }
.day-pill { display:inline-block; font-size:.78rem; font-weight:700; padding:5px 12px; border-radius:999px; background:var(--primary-soft); color:var(--primary-ink); }
.detail-actions { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 18px; }
.detail-actions .btn-ghost { width:auto; margin-top:0; padding:10px 14px; font-size:.86rem; display:inline-flex; align-items:center; }
.detail-actions .btn-ghost:hover { text-decoration:none; }
.topbar-config { margin-left:auto; color:var(--text-dim); display:flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:12px; }
.topbar-config:hover { color:var(--primary-ink); }
.tab-btn.tab-active { background:var(--primary); color:var(--on-primary); }

main#app { flex:1; width:100%; max-width:720px; margin:0 auto; padding:24px 16px 36px; }

footer.app-footer {
  text-align:center; padding:24px 16px 30px; font-size:.78rem; color:var(--text-faint);
  border-top:1px solid var(--border);
}
footer.app-footer .sep { margin:0 8px; opacity:.5; }
footer.app-footer strong { color:var(--text-dim); font-weight:600; }

h1 {
  font-size:1.6rem; font-weight:800; margin:2px 0 20px; letter-spacing:-.02em; color:var(--text);
}
h2 { font-size:.76rem; margin:0 0 16px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.07em; font-weight:800; display:flex; align-items:center; gap:8px; }
.muted { color:var(--text-dim); }

.panel {
  position:relative; overflow:hidden;
  background:linear-gradient(180deg, var(--panel), var(--bg-elev));
  border:1px solid var(--border); border-radius:var(--radius);
  padding:22px; margin-bottom:16px; box-shadow:var(--shadow);
}
/* Filete sutil no topo do card, efeito "vidro" discreto. */
.panel::before {
  content:''; position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.10), transparent);
}

.tiles { display:flex; flex-direction:column; gap:12px; margin-top:6px; }
.tile {
  display:flex; align-items:center; gap:14px; padding:20px;
  background:linear-gradient(180deg, var(--panel), var(--bg-elev));
  border:1px solid var(--border); border-radius:var(--radius);
  color:var(--text); font-weight:600; box-shadow:var(--shadow-sm);
  transition:border-color .15s, transform .15s, box-shadow .15s;
}
@media (hover:hover) { .tile:hover { text-decoration:none; border-color:var(--border-strong); transform:translateY(-2px); box-shadow:var(--shadow); } }
.tile .tile-icon {
  width:44px; height:44px; border-radius:13px; display:flex; align-items:center; justify-content:center;
  background:var(--bg); color:var(--primary-ink); font-size:1.3rem; flex-shrink:0;
  border:1px solid var(--border-strong);
}
@media (hover:hover) { .tile:hover .tile-icon { background:var(--primary); color:var(--on-primary); } }
.tile .tile-sub { display:block; font-weight:400; font-size:.8rem; color:var(--text-dim); margin-top:2px; overflow-wrap:anywhere; }
.tile.setting { width:100%; padding:16px; text-align:left; font:inherit; font-weight:600; cursor:pointer; }
.tile .tile-text { flex:1; min-width:0; }
.tile-chev { color:var(--text-dim); flex-shrink:0; }
div.tile.setting { cursor:default; }
div.tile.setting:hover { transform:none; border-color:var(--border); box-shadow:var(--shadow-sm); }
div.tile.setting:hover .tile-icon { background:var(--bg); color:var(--primary-ink); }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.sheet-error { margin:0 0 12px; padding:10px 12px; border-radius:var(--radius-sm); background:var(--danger-soft); color:var(--danger); font-size:.9rem; }

.btn-primary, .btn-valid, .btn-danger, .btn-ghost {
  border:none; border-radius:999px; padding:15px 22px; font-size:.98rem; font-weight:700;
  letter-spacing:-.005em; cursor:pointer; width:100%; margin-top:10px;
  transition:filter .15s, transform .05s, box-shadow .15s;
}
.btn-primary { background:var(--primary); color:var(--on-primary); box-shadow:var(--shadow-sm); }
.btn-danger { background:var(--danger); color:var(--on-danger); box-shadow:var(--shadow-sm); }
.btn-valid { background:var(--success); color:var(--on-success); box-shadow:var(--shadow-sm); }
/* Validar: os dois vereditos lado a lado e altos. Ações que descartam a
   tomada (Repetir, Abortar) ficam longe, atrás de um divisor e afastadas
   entre si, para não serem tocadas no lugar de outra coisa. */
.verdict-row { margin-top:4px; }
.verdict-row > button { min-height:64px; font-size:1.1rem; margin-top:0; }
.phase-alt { margin-top:22px; padding-top:14px; border-top:1px solid var(--border); display:flex; flex-wrap:wrap; justify-content:center; gap:12px 28px; }
.phase-alt .btn-ghost { width:auto; margin-top:0; min-height:44px; padding:10px 20px; font-size:.9rem; }

/* Fases da corrida: cada uma com a sua cara, para ler o estado de relance,
   sem precisar ler o título. Pronto = neutro (o botão amarelo é a ação);
   liberado = amarelo; correndo = verde; validar = tempo parado, emoldurado. */
.panel.phase { border-width:2px; }
.panel.phase::before { display:none; }
.phase-title { font-size:1.2rem; text-transform:none; letter-spacing:-.01em; color:var(--text); margin-bottom:10px; }
.phase .phase-who { font-size:1rem; margin-bottom:6px; }
.phase .phase-who strong { display:block; font-size:1.55rem; line-height:1.15; letter-spacing:-.015em; overflow-wrap:anywhere; }
.phase .live-dot { width:10px; height:10px; background:currentColor; box-shadow:none; }
.phase[data-phase="locked"] { border-color:var(--border-strong); }
.phase[data-phase="waiting_start"] { border-color:var(--primary-line); background:linear-gradient(var(--primary-soft), var(--primary-soft)), var(--panel); }
.phase[data-phase="waiting_start"] .phase-title { color:var(--primary-ink); }
.phase[data-phase="running"] { border-color:var(--success); background:linear-gradient(var(--success-soft), var(--success-soft)), var(--panel); }
.phase[data-phase="running"] .phase-title, .phase[data-phase="running"] .time-display { color:var(--success); }
.phase[data-phase="running"] .time-display { font-size:clamp(2.6rem, 13vw, 4.4rem); }
.phase[data-phase="validate"] { border-color:var(--text-dim); }
.time-stopped { border:2px solid var(--border-strong); border-radius:var(--radius-sm); padding:6px 10px; background:var(--bg-elev); }
/* Confirmação do veredito recém-dado */
.verdict-bar { display:flex; align-items:center; gap:10px; margin-bottom:12px; padding:10px 10px 10px 14px; border-radius:var(--radius-sm); border:1px solid; font-size:.95rem; }
.verdict-bar.is-valid { background:var(--success-soft); border-color:var(--success); color:var(--success); }
.verdict-bar.is-invalid { background:var(--danger-soft); border-color:var(--danger-line); color:var(--danger); }
.verdict-icon { flex-shrink:0; }
.verdict-text { flex:1; min-width:0; color:var(--text); overflow-wrap:anywhere; }
.verdict-time { font-variant-numeric:tabular-nums; font-weight:700; }
.verdict-fix { flex-shrink:0; min-height:44px; padding:0 14px; border-radius:999px; border:1px solid currentColor; background:none; color:inherit; font:inherit; font-weight:700; cursor:pointer; }
/* Alternar modo Sol */
.theme-toggle { margin-left:auto; width:44px; height:44px; display:flex; align-items:center; justify-content:center; background:none; border:none; border-radius:12px; color:var(--text-dim); cursor:pointer; }
.theme-toggle:hover { color:var(--primary-ink); }
.theme-toggle + .topbar-config { margin-left:0; }
.theme-toggle .ico-moon { display:none; }
:root[data-theme="sol"] .theme-toggle .ico-sun { display:none; }
:root[data-theme="sol"] .panel::before { display:none; } /* filete claro some no branco */
:root[data-theme="sol"] .theme-toggle .ico-moon { display:block; }
.btn-ghost { background:var(--panel-hover); color:var(--text); border:1px solid var(--border-strong); }
.btn-primary:hover, .btn-valid:hover, .btn-danger:hover, .btn-ghost:hover { filter:brightness(1.1); }
.btn-primary:active, .btn-valid:active, .btn-danger:active, .btn-ghost:active { transform:scale(.98); }
.btn-primary:disabled, .btn-danger:disabled { opacity:.5; }

/* Feedback visual enquanto uma ação (validar/armar/liberar/etc) está em
   andamento — sem isso, um clique que demora um pouco (rede lenta, ESP32
   ocupado) parece não ter feito nada, e a tentação é clicar de novo (que
   o "busy" em JS silenciosamente ignora, reforçando a impressão de bug). */
body.busy .btn-primary, body.busy .btn-valid, body.busy .btn-danger, body.busy .btn-ghost, body.busy .participant-btn {
  opacity:.5; pointer-events:none;
}

.participant-list { display:flex; flex-wrap:wrap; gap:10px; }
.participant-btn {
  display:flex; align-items:center; gap:9px;
  background:var(--panel-hover); color:var(--text); border:1px solid var(--border);
  border-radius:999px; padding:8px 16px 8px 8px; cursor:pointer; font-size:.92rem;
  transition:border-color .15s, transform .05s, background .15s;
}
.participant-btn:hover { border-color:var(--primary-ink); background:var(--primary-soft); }
.participant-btn:active { transform:scale(.97); }
.avatar {
  width:27px; height:27px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--bg); color:var(--primary-ink); font-size:.7rem; font-weight:800;
  border:1px solid var(--border-strong);
}
.participant-btn .p-meta { color:var(--text-faint); font-size:.8rem; }

.time-display {
  font-size:clamp(2.4rem, 12vw, 3.4rem); font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.03em;
  text-align:center; margin:18px 0; color:var(--text);
}

table { width:100%; border-collapse:collapse; }
td { padding:12px 8px; border-bottom:1px solid var(--border); }
td:last-child { text-align:right; font-variant-numeric:tabular-nums; font-weight:700; }
tr:last-child td { border-bottom:none; }
.pos { font-weight:800; }
.pos-1 { color:var(--gold); } .pos-2 { color:var(--silver); } .pos-3 { color:var(--bronze); }

.runs-list { list-style:none; padding:0; margin:0; }
.runs-list li { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border); gap:10px; }
.runs-list li:last-child { border-bottom:none; }
.runs-list .r-time { font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap; }

.badge { font-size:.7rem; padding:5px 12px; border-radius:999px; background:var(--panel-hover); color:var(--text-dim); white-space:nowrap; font-weight:700; letter-spacing:.01em; }
.badge.live { color:var(--success); background:var(--success-soft); display:inline-flex; align-items:center; gap:6px; }
.live-dot { width:6px; height:6px; border-radius:50%; background:var(--success); animation:pulse 1.6s ease-in-out infinite; box-shadow:0 0 0 3px var(--success-soft); }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.25; } }
.status-valid { background:var(--success-soft); color:var(--success); }
.status-invalid { background:var(--danger-soft); color:var(--danger); }
.att-valid { color:var(--success); }
.att-invalid { color:var(--danger); text-decoration:line-through; text-decoration-thickness:2px; }
.tv-best { font-weight:800; color:var(--success); }
.tv-best.none { color:var(--text-faint); font-weight:600; }
.att-dnf { color:var(--text-dim); }
.att-pending { color:var(--text-dim); }
.att-best { font-weight:800; }
.ranking-tv { padding:24px; }
.ranking-tv table { width:100%; border-collapse:collapse; }
.ranking-tv th, .ranking-tv td { padding:10px 14px; text-align:center; border-bottom:1px solid var(--border); }
.ranking-tv td:nth-child(2) { text-align:left; }
.status-pending { background:var(--warning-soft); color:var(--warning); }
/* Revisão das telas */
.topbar-home img { background:#fff; padding:4px 7px; border-radius:9px; }
.btn-ghost.danger-outline { color:var(--danger); border-color:var(--danger-line); }
.title-row { display:flex; align-items:flex-start; gap:6px; }
.title-row .detail-title { flex:1; }
.title-row .icon-btn { margin-top:-6px; }
.detail-actions .btn-accent { color:var(--primary-ink); border-color:var(--primary-line); }
.phase-who { font-size:1.05rem; margin:0 0 4px; }
.phase-who small { color:var(--text-dim); font-size:.88rem; }
.time-display.live { margin:10px 0 6px; }
.home-sub { text-align:center; margin:0 0 18px; }
.pick-list { flex-direction:column; gap:8px; }
.list-head { display:flex; align-items:center; justify-content:space-between; margin:4px 0 10px; }
.net-list { display:flex; flex-direction:column; gap:8px; margin-bottom:6px; }
.net-row { display:flex; align-items:center; gap:10px; width:100%; min-height:54px; padding:8px 14px; border-radius:14px; background:var(--panel-hover); border:1px solid var(--border); color:var(--text); font:inherit; font-weight:600; text-align:left; cursor:pointer; }
.net-row:hover { border-color:var(--primary-ink); }
.net-name { flex:1; min-width:0; overflow-wrap:anywhere; }
.net-name small { display:block; color:var(--text-dim); font-size:.8rem; font-weight:500; }
.net-sig { color:var(--text-dim); font-size:.82rem; font-weight:500; white-space:nowrap; }
.pick-list .participant-btn { width:100%; min-height:56px; border-radius:14px; padding:8px 14px 8px 10px; text-align:left; font-size:1rem; font-weight:600; }
.pick-text { display:flex; flex-direction:column; min-width:0; }
.pick-text .p-meta { font-weight:500; }
.tile-hero { border-color:var(--primary-line); }
.tile-hero .tile-icon { background:var(--primary); color:var(--on-primary); }
/* Ranking no celular: uma linha por robô, tempo grande à direita; tocar mostra as tomadas */
.rk-row { border-bottom:1px solid var(--border); }
.rk-row:last-child { border-bottom:none; }
.rk-row summary { display:flex; align-items:center; gap:12px; min-height:56px; padding:6px 0; list-style:none; cursor:pointer; color:var(--text); font-size:1rem; font-weight:600; }
.rk-row summary::-webkit-details-marker { display:none; }
.rk-pos { width:30px; flex-shrink:0; }
.rk-name { flex:1; min-width:0; overflow-wrap:anywhere; }
.rk-name small { display:block; color:var(--text-dim); font-size:.8rem; font-weight:500; }
.rk-best { font-size:1.15rem; font-weight:800; font-variant-numeric:tabular-nums; color:var(--success); white-space:nowrap; }
.rk-best.none { color:var(--text-faint); font-weight:600; }
.rk-atts { display:flex; flex-wrap:wrap; gap:8px; padding:0 0 14px 42px; }
.rk-att { display:flex; flex-direction:column; padding:6px 10px; border-radius:10px; background:var(--panel-hover); font-variant-numeric:tabular-nums; font-weight:700; font-size:.92rem; }
.rk-att small { color:var(--text-dim); font-size:.7rem; font-weight:600; }
/* Aviso de conexão perdida */
.offline-bar { position:sticky; top:0; z-index:20; padding:10px 16px; background:var(--danger); color:var(--on-danger); font-weight:700; font-size:.9rem; text-align:center; }
.offline-bar[hidden] { display:none; }
.panel-foot { margin-top:12px; text-align:right; }
.tv-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
.tv-head > div { min-width:0; }
.tv-full { flex-shrink:0; width:auto; margin:0; padding:10px 16px; font-size:.85rem; }
.ranking-tv th { font-size:.55em; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; }
.tv-team { display:block; font-size:.6em; color:var(--text-dim); font-weight:500; }
.ranking-tv td:nth-child(2) { overflow-wrap:anywhere; }
.tv-track { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 18px; margin:0 0 24px; padding:16px 22px; border-radius:var(--radius); border:2px solid var(--primary-line); background:var(--primary-soft); font-size:clamp(1rem, 2vw, 1.7rem); }
.tv-track-state { flex-basis:100%; font-weight:800; color:var(--primary-ink); }
.tv-track-name { font-size:1.4em; overflow-wrap:anywhere; }
.tv-track-time { margin-left:auto; font-size:2em; font-weight:800; font-variant-numeric:tabular-nums; }
.tv-track.is-running { border-color:var(--success); background:var(--success-soft); }
.tv-track.is-running .tv-track-state, .tv-track.is-running .tv-track-time { color:var(--success); }
/* Corridas recentes: tocar corrige o resultado */
.run-row { width:100%; display:flex; align-items:center; gap:10px; padding:12px 0; background:none; border:none; color:var(--text); font:inherit; text-align:left; }
button.run-row { cursor:pointer; }
.run-row .r-name { flex:1; min-width:0; overflow-wrap:anywhere; }
.run-row .r-name small { display:block; color:var(--text-dim); font-size:.8rem; }
.runs-list li.run-li { padding:0; display:block; }
.fix-choices .btn-row { flex-wrap:wrap; }
/* Painel (TV): sem a barra do juiz, letras para ver de longe */
body.tv .topbar, body.tv .app-footer { display:none; }
body.tv main#app { max-width:1400px; }
.ranking-tv h1 { font-size:clamp(2rem, 4.5vw, 3.6rem); margin:0 0 4px; }
.ranking-tv .tv-sub { font-size:clamp(1rem, 1.8vw, 1.5rem); margin:0 0 22px; }
.ranking-tv table { font-size:clamp(1.1rem, 2.4vw, 2.1rem); }
.tv-last { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; margin:0 0 24px; padding:16px 20px; border-radius:var(--radius); background:var(--primary-soft); border:1px solid var(--primary-line); font-size:clamp(1rem, 2vw, 1.7rem); }
.tv-last strong { font-size:1.1em; }
.tv-last .tv-time { font-weight:800; font-variant-numeric:tabular-nums; }
/* ---------- Telas maiores (tablet, notebook, monitor) ----------
   O celular é a base; daqui para baixo só entra o que muda com mais espaço. */
:focus-visible { outline:2px solid var(--primary-ink); outline-offset:2px; }
/* Movimento reduzido: o ponto fica parado (o título da fase já diz o
   estado) e painéis aparecem sem deslizar. */
@media (prefers-reduced-motion: reduce) {
  .live-dot { animation:none; }
  .sheet, body .sheet, .sheet-bd { transition:opacity .15s; }
  .tile:hover, .btn-primary:active, .btn-valid:active, .btn-danger:active, .btn-ghost:active, .participant-btn:active { transform:none; }
}
.desk-only { display:none; }
.tv-narrow { display:none; }

/* Tablet em diante: formulários viram uma janela no meio da tela */
@media (min-width: 768px) {
  body .sheet { left:50%; right:auto; top:50%; bottom:auto; width:min(560px, 92vw); max-height:85vh;
    border:1px solid var(--border-strong); border-radius:20px; padding:18px 22px 22px;
    transform:translate(-50%, -46%); opacity:0; transition:transform .2s ease, opacity .2s ease; }
  body .sheet.on { transform:translate(-50%, -50%); opacity:1; }
  body .sheet-grab { display:none; }
}

/* Notebook em diante */
@media (min-width: 900px) {
  main#app { padding-top:32px; }
  body[data-page="home"] main#app, body[data-page="config"] main#app { max-width:960px; }
  body[data-page="roster"] main#app { max-width:860px; }
  body[data-page="detail"] main#app { max-width:1240px; }

  /* Início e Configurações: blocos em duas colunas */
  .tiles { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:14px; }
  .tile-hero { grid-column:1 / -1; }

  /* Competição: controle da corrida e corridas à esquerda, ranking à direita, tudo à vista */
  .detail-grid { display:grid; grid-template-columns:minmax(0, 5fr) minmax(0, 6fr); gap:0 24px; align-items:start;
    grid-template-areas:"phase rank" "runs rank"; }
  .detail-grid .dg-phase { grid-area:phase; }
  .detail-grid .dg-rank { grid-area:rank; display:block !important; }
  .detail-grid .dg-runs { grid-area:runs; display:block !important; }
  .detail-grid .tabs-bar { display:none; }
  .detail-grid .desk-only { display:flex; }
}

/* Painel: tabela quando cabe, lista (igual à do celular) quando não */
@media (max-width: 699px) {
  .tv-wide { display:none; }
  .tv-narrow { display:block; }
  .ranking-tv { padding:8px 0; }
}

<script>
const API = '/api/v1';

// Modo Sol: escolha de cada aparelho (o juiz no sol, a TV na sala escura).
function syncThemeToggle() {
  const b = document.querySelector('.theme-toggle');
  if (b) b.setAttribute('aria-pressed', document.documentElement.dataset.theme === 'sol' ? 'true' : 'false');
}
window.toggleTheme = () => {
  const sol = document.documentElement.dataset.theme !== 'sol';
  if (sol) document.documentElement.dataset.theme = 'sol'; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem('tema', sol ? 'sol' : 'escuro'); } catch (e) {}
  syncThemeToggle();
};
syncThemeToggle();
// Leitura: acima do pior caso do ESP32 ocupado com a nuvem (~1,5 s) + Wi-Fi ruim.
// Escrita: importar/renomear regrava arquivos na flash e pode demorar mais.
const API_TIMEOUT_MS = 6000, API_WRITE_TIMEOUT_MS = 15000;
let busy = false;
let pollTimer = null;
let ctx = {};

let participantFilterText = '';
let lastPendingList = [];

function renderParticipantButtons(list, filterText) {
  const f = (filterText || '').trim();
  const filtered = (f ? list.filter(x => wordPrefixIndex(x.name, f) >= 0) : list).slice().sort((a, b) => a.name.localeCompare(b.name));
  if (filtered.length === 0) return '<p class="muted">Nenhum robô encontrado.</p>';
  return filtered.map(x => `<button class="participant-btn" onclick="doArm(${x.participant_id}, ${x.attempts_done + 1})">` +
    `<span class="avatar">${initials(x.name)}</span><span class="pick-text">${escapeHtml(x.name)}<span class="p-meta">${x.team_name ? escapeHtml(x.team_name) + ' · ' : ''}tomada ${x.attempts_done + 1} de ${x.attempts_per_day}</span></span></button>`).join('');
}

window.filterParticipants = (value) => {
  participantFilterText = value;
  const box = document.getElementById('participant-list-box');
  if (box) box.innerHTML = renderParticipantButtons(lastPendingList, participantFilterText);
};

const STATUS_LABELS = { pending_validation:'Aguardando validação', valid:'Válida', invalid:'Inválida', dnf:'Não completou', retried:'Repetida' };
const STATUS_CLASS = { pending_validation:'status-pending', valid:'status-valid', invalid:'status-invalid', dnf:'status-invalid' };

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Já devolve escapado: sempre vai direto pro HTML.
function initials(name) {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '?';
  if (parts.length === 1) return escapeHtml(parts[0][0].toUpperCase());
  return escapeHtml((parts[0][0] + parts[parts.length - 1][0]).toUpperCase());
}

function formatElapsed(us) {
  if (us === null || us === undefined) return '--:--.---';
  let totalMs = Math.floor(us / 1000);
  const ms = totalMs % 1000; totalMs = Math.floor(totalMs / 1000);
  const s = totalMs % 60; totalMs = Math.floor(totalMs / 60);
  const m = totalMs;
  const pad = (n, l) => String(n).padStart(l, '0');
  return pad(m, 2) + ':' + pad(s, 2) + '.' + pad(ms, 3);
}

// Posição no ranking - 1º/2º/3º já ganham cor de ouro/prata/bronze via
// posClass (sem emoji de medalha).
function medal(pos) {
  return pos + 'º';
}
function posClass(pos) { return pos >= 1 && pos <= 3 ? 'pos pos-' + pos : 'pos'; }


// Ranking da tela do juiz: uma linha por robô com o melhor tempo
// grande; tocar abre as tomadas. As linhas abertas sobrevivem ao polling.
const rankOpen = new Set();
window.rkToggle = (id, open) => { if (open) rankOpen.add(id); else rankOpen.delete(id); };

function attemptClass(a) {
  return a.status === 'valid' ? 'att-valid' : a.status === 'dnf' ? 'att-dnf' : a.status === 'pending_validation' ? 'att-pending' : 'att-invalid';
}

function renderRankingList(rows) {
  if (rows.length === 0) return '<p class="muted">Nenhum resultado ainda.</p>';
  return '<div class="rk-list">' + rows.map(r => {
    const hasBest = r.best_elapsed_us != null && r.best_elapsed_us >= 0;
    const atts = r.attempts.map((a, i) => a
      ? `<span class="rk-att ${attemptClass(a)}${a.is_best ? ' att-best' : ''}"><small>${a.day ? 'Dia ' + a.day + ', ' : ''}tomada ${a.attempt || i + 1}</small>${a.status === 'dnf' ? 'Não completou' : formatElapsed(a.elapsed_us)}</span>`
      : `<span class="rk-att"><small>tomada ${i + 1}</small>&mdash;</span>`).join('');
    return `<details class="rk-row"${rankOpen.has(r.participant_id) ? ' open' : ''} ontoggle="rkToggle(${r.participant_id}, this.open)">
      <summary><span class="${posClass(r.position)} rk-pos">${medal(r.position)}</span>
        <span class="rk-name">${escapeHtml(r.participant_name)}${r.team_name ? `<small>${escapeHtml(r.team_name)}</small>` : ''}</span>
        <span class="rk-best${hasBest ? '' : ' none'}">${hasBest ? formatElapsed(r.best_elapsed_us) : 'sem tempo'}</span></summary>
      <div class="rk-atts">${atts}</div></details>`;
  }).join('') + '</div>';
}

// Sessão do juiz: a senha é digitada na própria página
// (openLoginSheet) e o cronômetro devolve uma chave guardada aqui.
let sessionToken = '';
try { sessionToken = localStorage.getItem('sessao') || ''; } catch (e) {}
function setSession(token) {
  sessionToken = token || '';
  try { if (sessionToken) localStorage.setItem('sessao', sessionToken); else localStorage.removeItem('sessao'); } catch (e) {}
}
// X-Cronometro: o cronômetro recusa mudanças sem ele (proteção contra CSRF).
function authHeaders() {
  return sessionToken ? { 'X-Cronometro': '1', 'X-Sessao': sessionToken } : { 'X-Cronometro': '1' };
}

// quiet: não abre o login sozinho (consultas automáticas em segundo plano).
async function api(method, path, body, quiet) {
  const opts = { method, headers: authHeaders() };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  // Sem limite, um pedido que o cronômetro nunca responde (sinal fraco)
  // deixa o "busy" ligado e a tela inteira travada sem aviso.
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), method === 'GET' ? API_TIMEOUT_MS : API_WRITE_TIMEOUT_MS);
  opts.signal = ctrl.signal;
  let res, data = null;
  try {
    res = await fetch(API + path, opts);
    if (res.status !== 204) {
      try { data = await res.json(); } catch (e) {
        if (ctrl.signal.aborted) throw e; // corpo parou no meio: mesma falha de conexão
      }
    }
  } catch (e) {
    setOnline(false);
    throw new Error('Sem conexão com o cronômetro. Confira se o celular está no Wi-Fi dele.');
  } finally {
    clearTimeout(timer);
  }
  setOnline(true);
  if (res.status === 204) return null;
  if (res.status === 401) {
    if (!quiet) openLoginSheet();
    const err = new Error('Precisa entrar com a senha do juiz.');
    err.silent = true; // o painel de login já está explicando
    throw err;
  }
  if (!res.ok) throw new Error((data && data.detail) || 'Não foi possível falar com o cronômetro. Tente de novo.');
  return data;
}

// Faixa vermelha no topo enquanto o cronômetro não responde (celular saiu
// da rede dele, cronômetro desligado). Some sozinha na próxima resposta.
function setOnline(ok) {
  const bar = document.getElementById('offline-bar');
  if (bar) bar.hidden = ok;
}

async function withBusy(fn) {
  if (busy) return;
  busy = true;
  document.body.classList.add('busy'); // feedback visual imediato (ver CSS "body.busy")
  try { await fn(); } catch (e) { if (!e.silent) showError(e.message); } finally { busy = false; document.body.classList.remove('busy'); }
}

// Erro aparece dentro do painel aberto (no celular, alert() some fácil
// atrás do teclado); sem painel aberto, alert normal.
function showError(msg) {
  const sheet = sheetEls && sheetEls.sheet.classList.contains('on') ? sheetEls.sheet : null;
  if (!sheet) { alert(msg); return; }
  let el = sheet.querySelector('.sheet-error');
  if (!el) {
    el = document.createElement('p');
    el.className = 'sheet-error';
    el.setAttribute('role', 'alert');
    sheet.querySelector('.sheet-body').prepend(el);
  }
  el.textContent = msg;
  el.scrollIntoView({ block: 'nearest' });
}

async function downloadExport() {
  const res = await fetch(API + '/export', { headers: authHeaders() });
  if (res.status === 401) { openLoginSheet(); return; }
  if (!res.ok) throw new Error('Não foi possível baixar os dados. Tente de novo.');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(await res.blob());
  a.download = 'cronometro_export.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  if (rankingTvTimer) { clearInterval(rankingTvTimer); rankingTvTimer = null; }
}

let rankingTvTimer = null;

async function renderRankingTv(root, competitionId) {
  root.innerHTML = '<p class="muted">Carregando...</p>';
  let page = 0, draws = 0;
  const draw = async () => {
    let competition, ranking, runs, armState;
    try {
      [competition, ranking, runs, armState] = await Promise.all([
        api('GET', '/competitions/' + competitionId),
        api('GET', '/competitions/' + competitionId + '/ranking'),
        api('GET', '/competitions/' + competitionId + '/runs'),
        api('GET', '/arm'),
      ]);
    } catch (e) { return; }

    // Ninguém consegue rolar uma TV: o ranking anda sozinho de página em
    // página (a cada ~9 s), com quantas linhas couberem na altura da tela.
    const rows = ranking.ranking;
    const perPage = Math.max(4, Math.floor((window.innerHeight - 330) / 64));
    const pages = Math.max(1, Math.ceil(rows.length / perPage));
    if (++draws % 3 === 0) page = (page + 1) % pages;
    if (page >= pages) page = 0;
    const pageRows = rows.slice(page * perPage, (page + 1) * perPage);

    const onTrack = armState.armed && armState.competition_id === competitionId;
    const last = runs.filter(r => r.status !== 'retried').pop();
    const canFull = document.fullscreenEnabled && !document.fullscreenElement;
    root.innerHTML = `<div class="ranking-tv">
      <div class="tv-head">
        <div><h1>${escapeHtml(competition.name)}</h1>
        <p class="muted tv-sub">${competition.status === 'finished' ? 'Ranking final' : 'Ranking'}${pages > 1 ? ` · página ${page + 1} de ${pages}` : ''}</p></div>
        ${canFull ? '<button class="btn-ghost tv-full" type="button" onclick="document.documentElement.requestFullscreen().catch(() => {})">Tela cheia</button>' : ''}
      </div>
      ${onTrack ? renderTvOnTrack(armState) : last ? `<div class="tv-last"><span class="muted">Última corrida</span><strong>${escapeHtml(last.participant_name)}</strong>
        <span class="tv-time ${attemptClass(last)}">${last.status === 'dnf' ? 'Não completou' : formatElapsed(last.elapsed_us)}</span>
        <span class="badge ${STATUS_CLASS[last.status] || ''}">${STATUS_LABELS[last.status] || ''}</span></div>` : ''}
      <div class="tv-wide">${renderTvTable(pageRows)}</div>
      <div class="tv-narrow">${renderRankingList(pageRows)}</div>
    </div>`;
    syncLiveTimer(armState); // tempo corre na TV entre uma atualização e outra
  };
  await draw();
  rankingTvTimer = setInterval(() => { if (!document.hidden) draw(); }, 3000);
}

// O público vê quem está na pista e o tempo correndo, não só o ranking.
function renderTvOnTrack(a) {
  const state = a.started ? 'Correndo' : a.released ? 'Liberado, aguardando largada' : 'Na pista';
  return `<div class="tv-track${a.started ? ' is-running' : ''}">
    <span class="tv-track-state">${state}</span>
    <strong class="tv-track-name">${escapeHtml(a.participant_name)}</strong>
    <span class="muted">Dia ${a.day}, tomada ${a.attempt}</span>
    ${a.started ? `<span class="tv-track-time" id="live-timer">${formatElapsed(a.elapsed_us != null ? a.elapsed_us : 0)}</span>` : ''}
  </div>`;
}

// Tabela da TV: só o que se lê de longe. As tomadas uma a uma ficam na
// página do juiz (uma coluna por tomada vazava para os lados na TV).
function renderTvTable(rows) {
  if (rows.length === 0) return '<p class="muted">Nenhum resultado ainda.</p>';
  const body = rows.map(r => {
    const hasBest = r.best_elapsed_us != null && r.best_elapsed_us >= 0;
    return `<tr><td class="${posClass(r.position)}">${medal(r.position)}</td>
      <td>${escapeHtml(r.participant_name)}${r.team_name ? `<small class="tv-team">${escapeHtml(r.team_name)}</small>` : ''}</td>
      <td class="tv-best${hasBest ? '' : ' none'}">${hasBest ? formatElapsed(r.best_elapsed_us) : 'sem tempo'}</td></tr>`;
  }).join('');
  return `<table><thead><tr><th>Posição</th><th>Robô</th><th>Melhor tempo</th></tr></thead><tbody>${body}</tbody></table>`;
}

// ------------------- Roteamento -------------------

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);

// ------------------- Display do cronômetro -------------------
// A página conta ao ESP32 em que tela o juiz está - ao trocar de tela e a
// cada 10 s. O display mostra isso quando não há robô armado nem
// validação pendente; se o aviso parar (celular bloqueado, página
// fechada), depois de ~45 s o display volta a mostrar como acessar o
// painel. O "Painel" (tela de TV) não manda nada: não é o juiz.
let displayContext = null; // { view, competition_id, phase } ou null (não enviar)

function sendDisplayContext() {
  if (!displayContext || document.hidden) return;
  fetch(API + '/display-context', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify(displayContext),
  }).then(() => setOnline(true), () => setOnline(false)); // também serve de teste de conexão a cada 10 s
}

function setDisplayContext(view, competitionId, phase) {
  const next = view ? { view, competition_id: competitionId || 0, phase: phase || '' } : null;
  const changed = JSON.stringify(next) !== JSON.stringify(displayContext);
  displayContext = next;
  if (changed) sendDisplayContext();
}

setInterval(sendDisplayContext, 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) sendDisplayContext(); });

// ------------------- Painel que sobe de baixo -------------------
// Um painel por vez, por cima da tela (a lista atrás não se mexe). Fecha
// pelo X, por um botão com data-sheet-close, tocando fora ou com Esc.
// onMount(body) liga os eventos do conteúdo.
let sheetEls = null;

function ensureSheet() {
  if (sheetEls) return sheetEls;
  const bd = document.createElement('div');
  bd.className = 'sheet-bd';
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.setAttribute('role', 'dialog');
  sheet.setAttribute('aria-modal', 'true');
  document.body.append(bd, sheet);
  bd.addEventListener('click', closeSheet);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sheet.classList.contains('on')) closeSheet(); });
  sheetEls = { bd, sheet };
  return sheetEls;
}

function openSheet(title, bodyHtml, onMount) {
  const { bd, sheet } = ensureSheet();
  sheet.setAttribute('aria-label', title);
  sheet.innerHTML = `<div class="sheet-grab" aria-hidden="true"></div>
    <div class="sheet-head"><h2>${escapeHtml(title)}</h2>
      <button class="sheet-close" type="button" aria-label="Fechar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sheet-body">${bodyHtml}</div>`;
  sheet.querySelector('.sheet-close').addEventListener('click', closeSheet);
  sheet.querySelectorAll('[data-sheet-close]').forEach(b => b.addEventListener('click', closeSheet));
  const body = sheet.querySelector('.sheet-body');
  if (onMount) onMount(body);
  if (!sheet.classList.contains('on')) sheetOpener = document.activeElement;
  bd.classList.add('on');
  sheet.classList.add('on');
  document.body.classList.add('sheet-open');
  setSheetInert(true); // Tab e leitor de tela ficam dentro do painel
  // foca o 1º campo de texto (abre o teclado já no lugar certo); sem campo, o "Fechar"
  const first = body.querySelector('input:not([type=file]):not([type=hidden]), select') || sheet.querySelector('.sheet-close');
  setTimeout(() => first.focus(), 260);
}

let sheetOpener = null;
function setSheetInert(on) {
  document.querySelectorAll('body > header, body > main, body > footer').forEach(el => { el.inert = on; });
}

// Login do juiz: abre quando o cronômetro responde 401. "Só ver" fecha e
// a pessoa continua vendo ranking e corridas.
let loginOpen = false;
function openLoginSheet() {
  if (loginOpen) return;
  openSheet('Entrar como juiz', `
    <p class="muted hint" style="margin-top:0;">Para mexer no cronômetro, digite a senha do juiz. Sem ela, dá para ver o ranking e as corridas.</p>
    <form id="login-form">
      <label>Senha<input type="password" name="password" autocomplete="current-password" required></label>
      <div class="btn-row">
        <button class="btn-ghost" type="button" data-sheet-close>Só ver</button>
        <button class="btn-primary" type="submit">Entrar</button>
      </div>
    </form>`, (body) => {
    body.querySelector('#login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const password = new FormData(e.target).get('password');
      withBusy(async () => {
        const res = await api('POST', '/login', { password });
        if (!res || !res.token) throw new Error('O cronômetro não conseguiu abrir a sessão. Desligue e ligue o cronômetro e tente de novo.');
        setSession(res.token);
        render(); // refaz a tela, agora com permissão
      });
    });
  });
  loginOpen = true;
}

function closeSheet() {
  loginOpen = false;
  if (!sheetEls) return;
  sheetEls.bd.classList.remove('on');
  sheetEls.sheet.classList.remove('on');
  document.body.classList.remove('sheet-open');
  setSheetInert(false);
  if (sheetOpener && sheetOpener.isConnected) sheetOpener.focus({ preventScroll: true });
  sheetOpener = null;
}

function render() {
  closeSheet(); // trocou de tela - painel aberto não faz mais sentido
  stopPolling();
  const root = document.getElementById('app');
  const hash = location.hash || '#/';
  const mDetail = hash.match(/^#\/competitions\/(\d+)$/);
  const mRankingTv = hash.match(/^#\/competitions\/(\d+)\/ranking-tv$/);
  const mParticipants = hash.match(/^#\/competitions\/(\d+)\/participants$/);
  const mAddParticipants = hash.match(/^#\/competitions\/(\d+)\/participants\/add$/);
  const mRoster = hash.match(/^#\/roster$/);
  const mEditCompetition = hash.match(/^#\/competitions\/(\d+)\/edit$/);
  const mNew = hash.match(/^#\/competitions\/new$/);
  const mList = hash.match(/^#\/competitions$/);
  const mHistory = hash.match(/^#\/history$/);
  const mConfig = hash.match(/^#\/config$/);
  document.body.dataset.page = mRankingTv ? 'tv' : mDetail ? 'detail' : mRoster ? 'roster' : mConfig ? 'config'
    : (mParticipants || mAddParticipants || mEditCompetition || mNew || mList || mHistory) ? 'form' : 'home';

  const id = m => parseInt(m[1], 10);
  document.body.classList.toggle('tv', !!mRankingTv); // Painel: sem a barra do juiz
  if (mRankingTv) setDisplayContext(null);
  else if (mParticipants) setDisplayContext('inscritos', id(mParticipants));
  else if (mAddParticipants) setDisplayContext('add', id(mAddParticipants));
  else if (mRoster) setDisplayContext('roster');
  else if (mEditCompetition) setDisplayContext('competition', id(mEditCompetition), 'select');
  else if (mNew) setDisplayContext('new');
  else if (mDetail) setDisplayContext('competition', id(mDetail), 'select'); // fase exata chega no refreshDetail
  else if (mList) setDisplayContext('competitions');
  else if (mHistory) setDisplayContext('history');
  else if (mConfig) setDisplayContext('config');
  else setDisplayContext('home');

  if (mRankingTv) return renderRankingTv(root, parseInt(mRankingTv[1], 10));
  if (mParticipants) return renderCompetitionParticipants(root, parseInt(mParticipants[1], 10));
  if (mAddParticipants) return renderCompetitionAdd(root, parseInt(mAddParticipants[1], 10));
  if (mRoster) return renderRosterPage(root);
  if (mEditCompetition) return renderEditCompetition(root, parseInt(mEditCompetition[1], 10));
  if (mNew) return renderNewCompetition(root);
  if (mDetail) return renderCompetitionDetail(root, parseInt(mDetail[1], 10));
  if (mList) return renderCompetitionsList(root);
  if (mHistory) return renderHistoryList(root);
  if (mConfig) return renderConfig(root);
  return renderHome(root);
}

// ------------------- Configurações -------------------
// Cada item mostra o estado numa linha; tocar abre o painel de baixo com o
// formulário (mesmo padrão de Equipes e robôs).

const SETTING_ICONS = {
  wifi: '<path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5.5 12a10 10 0 0 1 13 0"/><path d="M9 15.5a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r="1"/>',
  phone: '<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  cloud: '<path d="M7 18a5 5 0 1 1 .9-9.9A6 6 0 0 1 19 10a4 4 0 0 1-1 8H7z"/>',
  download: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
};

function settingTile(id, icon, title, sub, clickable = true) {
  const tag = clickable ? 'button' : 'div';
  return `<${tag} class="tile setting"${clickable ? ` type="button" id="${id}"` : ''}>
    <span class="tile-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SETTING_ICONS[icon]}</svg></span>
    <span class="tile-text">${title}<span class="tile-sub" id="${id}-sub">${sub}</span></span>
    ${clickable ? '<svg class="tile-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>' : ''}
  </${tag}>`;
}

function internetSub(w) {
  const st = w.status;
  if (st.state === 'connected') return `<span style="color:var(--success)">Conectado</span> a ${escapeHtml(st.ssid)} · sinal ${wifiSignalLabel(st.rssi)}`;
  if (st.state === 'connecting') return `<span style="color:var(--warning)">Conectando</span> a ${escapeHtml(st.ssid)}...`;
  if (st.state === 'waiting') return `<span style="color:var(--danger)">Sem conexão</span> com ${escapeHtml(st.ssid)}` +
    (st.last_error ? `: ${escapeHtml(st.last_error)}` : '') + '. Tentando de novo...';
  return 'Desligada';
}

function apSub(st) {
  return `${escapeHtml(st.ap_ssid)} · senha <strong style="color:var(--text)">${escapeHtml(st.ap_password)}</strong> · ` +
    plural(st.ap_clients, 'aparelho', 'aparelhos');
}

async function renderConfig(root) {
  root.innerHTML = '<a class="back" href="#/">&larr; Início</a><p class="muted">Carregando...</p>';
  let cfg, judgeAuth, wifi;
  try {
    [cfg, judgeAuth, wifi] = await Promise.all([api('GET', '/cloud-config'), api('GET', '/judge-auth'), api('GET', '/wifi-config')]);
  } catch (e) { root.innerHTML += '<p>' + escapeHtml(e.message) + '</p>'; return; }

  root.innerHTML = `
    <a class="back" href="#/">&larr; Início</a>
    <h1>Configurações</h1>
    <div class="tiles">
      ${settingTile('set-internet', 'wifi', 'Internet', internetSub(wifi))}
      ${settingTile('set-ap', 'phone', 'Wi-Fi do cronômetro', apSub(wifi.status), false)}
      ${settingTile('set-judge', 'lock', 'Senha do juiz', judgeAuth.enabled ? 'Ligada · o público só consegue ver' : 'Desligada · qualquer um no Wi-Fi pode mexer')}
      ${settingTile('set-cloud', 'cloud', 'Ranking online', cfg.online_active ? '<span style="color:var(--success)">Ligado</span>' : 'Desligado · opcional')}
      ${settingTile('set-backup', 'download', 'Backup', 'Baixar uma cópia de equipes, robôs, competições e corridas')}
    </div>
  `;

  const again = () => { closeSheet(); renderConfig(root); };
  document.getElementById('set-internet').addEventListener('click', () => openWifiSheet(wifi, again));
  document.getElementById('set-judge').addEventListener('click', () => openJudgeSheet(judgeAuth, again));
  document.getElementById('set-cloud').addEventListener('click', () => openCloudSheet(cfg, again));
  document.getElementById('set-backup').addEventListener('click', () => withBusy(downloadExport));

  // Estado ao vivo enquanto a tela estiver aberta (render() para o timer ao sair).
  stopPolling();
  pollTimer = setInterval(async () => {
    try {
      wifi = await api('GET', '/wifi-config', undefined, true);
      const a = document.getElementById('set-internet-sub');
      const b = document.getElementById('set-ap-sub');
      if (a) a.innerHTML = internetSub(wifi);
      if (b) b.innerHTML = apSub(wifi.status);
    } catch (e) { /* ignora - próxima rodada tenta de novo */ }
  }, 3000);
}

function openJudgeSheet(judgeAuth, done) {
  const on = judgeAuth.enabled;
  openSheet('Senha do juiz', `
    <p class="muted hint" style="margin-top:0;">${on
      ? 'Ligada. Qualquer um no Wi-Fi do cronômetro vê o ranking e as corridas; para mexer, a página pede esta senha.'
      : 'Com senha, o público só consegue ver o ranking e as corridas. Para mexer, a página pede a senha.'}</p>
    <form id="judge-form">
      <label>${on ? 'Nova senha' : 'Senha'}<input type="password" name="password" autocomplete="new-password" required minlength="6" placeholder="Pelo menos 6 caracteres"></label>
      <div class="btn-row">
        <button class="btn-ghost" type="button" data-sheet-close>Cancelar</button>
        <button class="btn-primary" type="submit">${on ? 'Trocar senha' : 'Ligar senha'}</button>
      </div>
    </form>
    ${on ? `<div class="btn-row" style="margin-top:14px;">
      ${sessionToken ? '<button class="btn-ghost" type="button" id="judge-logout">Sair deste aparelho</button>' : ''}
      <button class="btn-ghost" type="button" id="judge-remove" style="color:var(--danger);">Desligar senha</button>
    </div>` : ''}`, (body) => {
    body.querySelector('#judge-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const password = new FormData(e.target).get('password').trim();
      if (password.length < 6) { showError('A senha precisa ter pelo menos 6 caracteres.'); return; }
      withBusy(async () => {
        const res = await api('POST', '/judge-auth', { password });
        setSession(res.token); // quem criou a senha continua dentro
        done();

function wifiSignalLabel(rssi) {
  if (rssi >= -60) return 'ótimo';
  if (rssi >= -70) return 'bom';
  if (rssi >= -80) return 'fraco';
  return 'muito fraco';
}

// Abre já buscando as redes; tocar numa rede mostra só os campos
// que ela pede (senha, usuário e senha, ou nada). "Outra rede" para rede
// escondida.
function openWifiSheet(w, done) {
  const st = w.status;
  const connected = w.security !== 'none';
  openSheet('Internet', `
    <p class="phase-who" style="margin-bottom:12px;">${st.state === 'connected'
      ? `Conectado a <strong>${escapeHtml(st.ssid)}</strong> <small>· sinal ${wifiSignalLabel(st.rssi)}</small>`
      : connected ? `<small>Tentando conectar a</small> <strong>${escapeHtml(st.ssid)}</strong>` : '<small>Sem internet. A corrida funciona normalmente.</small>'}</p>
    <div id="wifi-step"></div>`, (body) => {
    const step = body.querySelector('#wifi-step');
    let networks = [];

    const save = (payload) => withBusy(async () => {
      await api('POST', '/wifi-config', { ...payload, eap_method: w.eap_method || 'peap' });
      done();
    });

    function showList(msg) {
      step.innerHTML = `
        <div class="list-head"><h2 style="margin:0;">Redes por perto</h2>
          <button class="link-btn link-primary" type="button" id="wifi-rescan">Buscar de novo</button></div>
        <div class="net-list">${msg ? `<p class="muted">${msg}</p>` : networks.map((n, i) => `
          <button type="button" class="net-row" data-i="${i}">
            <span class="net-name">${escapeHtml(n.ssid)}<small>${n.ssid === st.ssid && st.state === 'connected' ? 'conectado agora' : n.enterprise ? 'usuário e senha' : n.open ? 'sem senha' : 'senha'}</small></span>
            <span class="net-sig">${wifiSignalLabel(n.rssi)}</span></button>`).join('')}
          <button type="button" class="net-row" id="wifi-other"><span class="net-name">Outra rede<small>digitar o nome</small></span></button>
        </div>
        ${connected ? '<button class="btn-ghost danger-outline" type="button" id="wifi-off">Desconectar da internet</button>' : ''}`;
      step.querySelector('#wifi-rescan').addEventListener('click', scan);
      step.querySelectorAll('[data-i]').forEach(b => b.addEventListener('click', () => {
        const n = networks[parseInt(b.dataset.i, 10)];
        showForm(n.ssid, n.enterprise ? 'enterprise' : n.open ? 'open' : 'personal', false);
      }));
      step.querySelector('#wifi-other').addEventListener('click', () => showForm('', 'personal', true));
      const off = step.querySelector('#wifi-off');
      if (off) off.addEventListener('click', () => save({ security: 'none', ssid: '', username: '', password: '' }));
    }

    function showForm(ssid, kind, typed) {
      const same = ssid && ssid === w.ssid && w.has_password;
      step.innerHTML = `
        <form id="wifi-form">
          ${typed ? `<label>Nome da rede<input name="ssid" autocomplete="off" required></label>
            <label>Tipo<select name="kind">
              <option value="personal">Com senha</option>
              <option value="enterprise">Com usuário e senha (eduroam)</option>
              <option value="open">Sem senha</option></select></label>`
            : `<p class="phase-who"><strong>${escapeHtml(ssid)}</strong></p>`}
          <label class="f-user">Usuário (RA ou e-mail)<input name="username" autocomplete="off" value="${ssid === w.ssid ? escapeHtml(w.username) : ''}"></label>
          <label class="f-pass">Senha<input type="password" name="password" autocomplete="new-password" placeholder="${same ? 'Deixe em branco para manter a atual' : ''}"></label>
          <div class="btn-row">
            <button class="btn-ghost" type="button" id="wifi-back">Voltar</button>
            <button class="btn-primary" type="submit">Conectar</button>
          </div>
        </form>`;
      const form = step.querySelector('#wifi-form');
      const kindOf = () => typed ? form.kind.value : kind;
      const apply = () => {
        form.querySelector('.f-user').style.display = kindOf() === 'enterprise' ? '' : 'none';
        form.querySelector('.f-pass').style.display = kindOf() === 'open' ? 'none' : '';
      };
      if (typed) form.kind.addEventListener('change', apply);
      apply();
      const first = form.querySelector(typed ? 'input[name=ssid]' : kindOf() === 'enterprise' ? 'input[name=username]' : 'input[name=password]');
      if (first) first.focus();
      step.querySelector('#wifi-back').addEventListener('click', () => showList());
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const k = kindOf();
        const name = typed ? form.ssid.value.trim() : ssid;
        if (!name) { showError('Informe o nome da rede.'); return; }
        save({
          security: k === 'enterprise' ? 'enterprise' : 'personal', // rede aberta = "com senha" e senha vazia
          ssid: name,
          username: k === 'enterprise' ? form.username.value.trim() : '',
          password: k === 'open' ? '' : form.password.value,
        });
      });
    }

    // Busca roda no ESP32 em segundo plano, sem travar o cronômetro.
    async function scan() {
      showList('Buscando redes...');
      try {
        let res = await api('GET', '/wifi-scan?refresh=1');
        for (let i = 0; i < 20 && res.scanning; i++) {
          await new Promise(r => setTimeout(r, 700));
          res = await api('GET', '/wifi-scan');
        }
        networks = res.networks || [];
        showList(res.failed ? 'Não deu para buscar agora (o cronômetro está tentando conectar). Toque em Buscar de novo daqui a pouco.'
          : networks.length === 0 ? 'Nenhuma rede encontrada. O cronômetro só enxerga redes 2,4 GHz.' : '');
      } catch (e) {
        if (!e.silent) showList(escapeHtml(e.message));
      }
    }
    scan();
  });
}

// ------------------- Equipes e robôs (cadastro geral) -------------------
// Tudo que é CADASTRO fica nesta tela: criar equipe/robô, importar
// planilha, renomear equipe, corrigir nome/equipe/código de robô. A
// competição só inscreve e remove robôs (renderCompetitionParticipants /
// renderCompetitionAdd) - nunca cria nem edita cadastro.
// Equipes aparecem recolhidas (só nome + quantidade); tocar abre os robôs.

// Limites em BYTES (UTF-8) - mesmos tamanhos dos campos em data_store.h
// (char[40] / char[24], contando o terminador).
const IMPORT_MAX_NAME_BYTES = 39;
const IMPORT_MAX_CODE_BYTES = 23;

const IMPORT_FIELD_ALIASES = {
  team: ['equipe', 'team', 'time', 'escola', 'instituicao', 'nome da equipe'],
  name: ['robo', 'robot', 'nome', 'name', 'nome do robo', 'participante', 'competidor'],
  code: ['codigo', 'code', 'external_code', 'numero'],
};
const IMPORT_ROBOT_LIST_KEYS = ['robos', 'robots', 'participantes', 'participants', 'competidores'];


function normalizeKey(s) {
  return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase();
}

function importFieldFor(key) {
  const k = normalizeKey(key);
  for (const field in IMPORT_FIELD_ALIASES) {
    if (IMPORT_FIELD_ALIASES[field].includes(k)) return field;
  }
  return null;
}

// Excel em português costuma salvar CSV em Windows-1252, não UTF-8 -
// tenta UTF-8 estrito primeiro e cai pro 1252 se os bytes não baterem.
function decodeImportFile(buffer) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buffer); }
  catch (e) { return new TextDecoder('windows-1252').decode(buffer); }
}

function parseCsvText(text) {
  text = text.replace(/^﻿/, '');
  const firstLine = text.split(/\r?\n/, 1)[0];
  const counts = { ';': firstLine.split(';').length, ',': firstLine.split(',').length, '\t': firstLine.split('\t').length };
  const delim = Object.keys(counts).reduce((a, b) => counts[b] > counts[a] ? b : a);

  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false;
      } else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === delim) { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  const nonEmpty = rows.filter(r => r.some(v => v.trim() !== ''));
  if (nonEmpty.length === 0) return [];

  // Com cabeçalho (equipe/robo/codigo em qualquer ordem) ou, se a
  // primeira linha não tiver nomes de coluna reconhecíveis, colunas
  // fixas na ordem equipe, robô, código.
  const headerMap = nonEmpty[0].map(importFieldFor);
  let col = { team: 0, name: 1, code: 2 };
  let dataRows = nonEmpty;
  if (headerMap.includes('team') && headerMap.includes('name')) {
    col = { team: headerMap.indexOf('team'), name: headerMap.indexOf('name'), code: headerMap.indexOf('code') };
    dataRows = nonEmpty.slice(1);
  }
  return dataRows.map(r => ({
    team: r[col.team] || '',
    name: r[col.name] || '',
    code: col.code >= 0 ? (r[col.code] || '') : '',
  }));
}

// Aceita lista plana [{equipe, robo, codigo}] ou agrupada por equipe
// [{equipe, robos: ['A', {nome:'B', codigo:'X'}]}], solta ou dentro de
// um objeto ({competidores: [...]}, {equipes: [...]}, etc.).
function parseJsonText(text) {
  const data = JSON.parse(text.replace(/^﻿/, ''));
  let list = data;
  if (!Array.isArray(list) && list && typeof list === 'object') {
    list = Object.values(list).find(Array.isArray);
  }
  if (!Array.isArray(list)) throw new Error('JSON sem nenhuma lista de competidores.');

  const out = [];
  for (const item of list) {
    if (!item || typeof item !== 'object') continue;
    const fields = { team: '', name: '', code: '' };
    let robots = null;
    for (const key in item) {
      if (IMPORT_ROBOT_LIST_KEYS.includes(normalizeKey(key)) && Array.isArray(item[key])) { robots = item[key]; continue; }
      const f = importFieldFor(key);
      if (f && item[key] != null && typeof item[key] !== 'object') fields[f] = String(item[key]);
    }
    if (!robots) { out.push(fields); continue; }
    // Agrupado: o "nome" do item, se não houver "equipe", é o nome da equipe.
    const teamName = fields.team || fields.name;
    for (const r of robots) {
      if (typeof r === 'string' || typeof r === 'number') { out.push({ team: teamName, name: String(r), code: '' }); continue; }
      if (!r || typeof r !== 'object') continue;
      const rf = { team: teamName, name: '', code: '' };
      for (const key in r) {
        const f = importFieldFor(key);
        if (f && r[key] != null && typeof r[key] !== 'object') rf[f] = String(r[key]);
      }
      out.push(rf);
    }
  }
  return out;
}

function validateImportRows(rows) {
  const seen = new Set();
  const byteLen = s => new TextEncoder().encode(s).length;
  return rows.map(r => {
    const row = { team: r.team.trim(), name: r.name.trim(), code: r.code.trim(), error: '' };
    if (!row.team) row.error = 'sem equipe';
    else if (!row.name) row.error = 'sem nome do robô';
    else if (row.team.includes('"') || row.name.includes('"')) row.error = 'aspas (") não são permitidas';
    else if (byteLen(row.team) > IMPORT_MAX_NAME_BYTES) row.error = 'nome da equipe longo demais';
    else if (byteLen(row.name) > IMPORT_MAX_NAME_BYTES) row.error = 'nome do robô longo demais';
    else if (byteLen(row.code) > IMPORT_MAX_CODE_BYTES) row.error = 'código longo demais';
    else {
      const key = normalizeKey(row.team) + '|' + normalizeKey(row.name);
      if (seen.has(key)) row.error = 'repetido no arquivo';
      seen.add(key);
    }
    return row;
  });
}

async function readImportFile(file) {
  const text = decodeImportFile(await file.arrayBuffer());
  const looksJson = /\.json$/i.test(file.name) || /^\s*[\[{]/.test(text.replace(/^﻿/, ''));
  const rows = looksJson ? parseJsonText(text) : parseCsvText(text);
  if (rows.length === 0) throw new Error('Nenhum competidor encontrado no arquivo.');
  return validateImportRows(rows);
}

function downloadImportTemplate() {
  const csv = '﻿equipe;robo;codigo\nEquipe Falcão;Falcão 1;F01\nEquipe Falcão;Falcão 2;F02\nEquipe Coruja;Coruja;\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'modelo_competidores.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

let flashMsg = null;
function takeFlash(key) {

// Mesma regra do firmware (data_store.cpp nameIsValid + tamanho dos campos).
function validateEditName(name, what) {
  if (!name) return 'Informe o nome ' + what + '.';
  if (name.includes('"')) return 'Aspas (") não são permitidas no nome ' + what + '.';
  if (new TextEncoder().encode(name).length > IMPORT_MAX_NAME_BYTES) return 'Nome ' + what + ' longo demais.';
  return '';
}
function validateCode(code) {
  return new TextEncoder().encode(code).length > IMPORT_MAX_CODE_BYTES ? 'Código longo demais.' : '';
}

function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

function chevronSvg(open) {
